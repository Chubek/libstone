# BFD.yaml — what GNU BFD (binutils/bfd) taught us about object-file formats.
#
# Purpose
#   Source-reading notes for qBFD maintainers, based on selected C sources
#   under `binutils/bfd` and their format headers. Comparisons describe the
#   current qBFD code; they do not establish its implementation history.
#
#   It is a *description*, not a configuration file. Nothing reads it at build
#   time; it exists so that a future change to qBFD can be checked against the
#   reference implementation instead of against memory.
#
# Source of truth
#   Tree:     binutils/            (git d727c90, "binutils 2.22 import")
#   Version:  BFD_VERSION_DATE 20111121, bfd/version.h:1
#   Vintage:  2011-era. This matters: several formats and machines that exist
#             today were NOT in this tree. See `divergences.bfd_2_22_absences`.
#   Citation convention
#             BFD citations are relative to binutils/; qBFD citations with
#             q*.hpp paths are relative to yellowstone/qbfd/. Lines refer to the tree as
#             imported; treat them as pointers, not as an API contract.
#
# How to read this file
#   architecture.*   The generic BFD layer: the object model, the target
#                    vector, and how format detection is dispatched.
#   formats.*        Per-format findings: detection, layout, tables, flags.
#   canonical_model  The format-independent vocabulary that qBFD exposes and
#                    how each backend maps onto it.
#   divergences      Observed differences and resolved qBFD questions.
#   qbfd_mapping     Which qBFD header implements which finding.

meta:
  document: BFD
  purpose: "Knowledge capture from binutils/bfd for the qBFD readers and ArchBFD application layer"
  audience: "maintainers of yellowstone/qbfd"
  status: current
  created: "2026-10-22"
  language: "en"
  dependency_policy: "BFD is reference material only; this document introduces no BFD imports or link dependency."

source:
  tree: binutils/
  commit: d727c90
  version: "binutils 2.22"
  version_date: 20111121
  version_header: bfd/version.h:1
  c_file_count: 335
  header_count: 63
  inventory_scope: "Top-level bfd/*.c and bfd/*.h; these counts are inventory, not files read in full."
  note: >-
    bfd/bfd.h is generated at build time from bfd/bfd-in2.h. Citations to
    "bfd-in2.h" are citations to the tracked source of the public API.
  primary_files:
    core:
      - bfd/bfd.c              # generic library, error handling, scan_vma, demangle
      - bfd/libbfd.c           # shared stubs: bfd_true/false/nullvoidptr/bfd_0
      - bfd/format.c           # bfd_check_format_matches: the format dispatcher
      - bfd/bfd-in2.h          # bfd, bfd_section, bfd_symbol, bfd_target, SEC_*, bfd_error
      - bfd/hash.c             # chained string-key hash tables
      - bfd/cache.c            # LRU cache of open file streams
      - bfd/opncls.c           # handle lifecycle, custom streams, arena allocation
      - bfd/bfdio.c            # I/O dispatch, archive-relative offsets, memory I/O
      - bfd/section.c          # section identity, contents, output state
      - bfd/syms.c             # canonical symbols, minisymbols, nm classification
      - bfd/reloc.c            # relocation descriptors and generic application
      - bfd/targets.c          # target-name lookup and default selection
      - bfd/archures.c         # machine compatibility and addressable units
    elf:
      - bfd/elf.c              # ELF backend proper
      - bfd/elfcode.h          # ELF backend template, compiled for 32 and 64 bit
      - bfd/elf-bfd.h          # elf_backend_data, elf_size_info
      - bfd/elfxx-target.h     # per-target ELF vector
      - bfd/elflink.c          # selected ELF relocation-reading paths
    coff:
      - bfd/coffgen.c          # generic COFF backend
      - bfd/coffcode.h         # COFF backend template
      - bfd/libcoff.h          # COFF structures
      - bfd/coffswap.h         # byte-swap routines
    pe:
      - bfd/peXXigen.c         # PE backend
      - bfd/peicode.h          # PE backend template
    macho:
      - bfd/mach-o.c           # Mach-O backend
    archive:
      - bfd/archive.c          # ar backend
      - bfd/archive64.c        # /SYM64/ armap

# ---------------------------------------------------------------------------
# 1. The generic layer
# ---------------------------------------------------------------------------
architecture:
  model:
    summary: >-
      BFD is a single generic object model plus a vector of per-format
      callbacks. A `bfd` is the handle; `asection`, `asymbol` and `arelent`
      describe sections, symbols and relocations. Input tables can be read
      lazily by backend callbacks. qBFD exposes analogous concepts through
      `ObjectFile`, `Section`, `Symbol` and `Relocation`.
    bfd:
      source: bfd/bfd-in2.h:5233-5498
      key_fields:
        - {name: id, purpose: "unique identifier"}
        - {name: filename, purpose: "name the application opened"}
        - {name: xvec, purpose: "pointer to the target jump table"}
        - {name: iovec, purpose: "IO vector giving access to the backing file"}
        - {name: format, purpose: "bfd_object / bfd_archive / bfd_core / bfd_unknown"}
        - {name: direction, purpose: "no_direction / read / write / both"}
        - {name: flags, purpose: "format-specific flags (HAS_RELOC, EXEC_P, DYNAMIC, ...)"}
        - {name: tdata, purpose: "backend-private per-file data (void* / union)"}
        - {name: sections, purpose: "linked list of bfd_section"}
        - {name: outsymbols, purpose: "array of asymbol pointers for output; also used to cache linker input symbols"}
        - {name: symcount / dynsymcount, purpose: "ordinary and dynamic symbol counts"}
    bfd_section:
      source: bfd/bfd-in2.h:1155-1536
      key_fields:
        - {name: name, purpose: "section name"}
        - {name: flags, purpose: "SEC_* bitmask (see canonical_model.section_flags)"}
        - {name: size / rawsize, purpose: "section size in octets and optional original input size"}
        - {name: filepos, purpose: "offset in the file"}
        - {name: vma, purpose: "virtual address"}
        - {name: lma, purpose: "load address"}
        - {name: alignment_power, purpose: "log2 of the required alignment"}
        - {name: entsize, purpose: "size of one entry, for tables and merge sections"}
        - {name: reloc / reloc_count, purpose: "relocations attached to this section"}
        - {name: target_index, purpose: "backend section number; distinct from the canonical index"}
        - {name: output_section / output_offset, purpose: "placement of this input section in linker output"}
        - {name: used_by_bfd, purpose: "backend-private section data"}
      lesson: >-
        Canonical fields do not preserve every native header field. For example,
        _bfd_elf_make_section_from_shdr stores the native header in backend
        section data (bfd/elf.c:831-837). qBFD likewise keeps native metadata
        and format-specific layouts alongside its common Section model.
    bfd_symbol:
      source: bfd/bfd-in2.h:5038-5178
      key_fields:
        - {name: name, purpose: "symbol name"}
        - {name: value, purpose: "address, or section-relative offset"}
        - {name: flags, purpose: "BSF_* bitmask"}
        - {name: section, purpose: "defining section, or bfd_und_section_ptr"}
        - {name: the_bfd, purpose: "owning BFD, including for symbols attached to global pseudo-sections"}
        - {name: udata, purpose: "backend-special pointer or integer data"}
    arelent:
      source: bfd/bfd-in2.h:2247-2262
      note: "arelent holds address, sym_ptr_ptr (asymbol **), addend and a reloc_howto_type pointer."
    reloc_howto_type:
      source: bfd/bfd-in2.h:2283-2366
      purpose: >-
        BFD's per-relocation-type descriptor. This is the single most
        important structure for understanding how BFD models relocations.
      fields:
        - {name: type, purpose: "format-native relocation number"}
        - {name: rightshift, purpose: "shift applied to the computed value"}
        - {name: size, purpose: "encoded storage width; use bfd_get_reloc_size, not a log2 formula (bfd/reloc.c:432-445)"}
        - {name: bitsize, purpose: "width of the field in bits"}
        - {name: pc_relative, purpose: "value is relative to the place"}
        - {name: bitpos, purpose: "position of the field within the word"}
        - {name: complain_on_overflow, purpose: "overflow policy"}
        - {name: special_function, purpose: "per-type relocation callback"}
        - {name: name, purpose: "human-readable name, e.g. \"R_X86_64_PC32\""}
        - {name: partial_inplace, purpose: "whether partial linking updates the section field in place; often associated with an implicit addend, but has backend exceptions"}
        - {name: src_mask, purpose: "mask selecting the source field"}
        - {name: dst_mask, purpose: "mask selecting the destination field"}
        - {name: pcrel_offset, purpose: "extra adjustment for PC-relative relocs"}
      macro: "HOWTO(C,R,S,B,P,BI,O,SF,NAME,INPLACE,MASKSRC,MASKDST,PC) bfd/bfd-in2.h:2368"
      lesson: >-
        The `name` field of the howto table IS the relocation naming mechanism
        in this BFD vintage. Reverse lookups are dispatched through
        reloc_name_lookup; numeric BFD relocation codes use reloc_type_lookup.
        qBFD's `Relocation::typeName` plays the role of `howto->name`.

  target_vector:
    struct: bfd/bfd-in2.h:5784-6150
    description: >-
      A `bfd_target` is a static, per-format-and-machine description of every
      callback BFD can invoke. A target is selected per file.
    scalar_fields:
      - {name: name, purpose: "human name, e.g. \"elf64-x86-64\""}
      - {name: flavour, purpose: "broad family, such as bfd_target_elf_flavour or bfd_target_coff_flavour; PE uses the COFF flavour"}
      - {name: byteorder, purpose: "order of bytes in the data area"}
      - {name: header_byteorder, purpose: "order of bytes in the header area"}
      - {name: object_flags, purpose: "mask of the bfd-level flags this target may set"}
      - {name: section_flags, purpose: "mask of the SEC_* flags this target may set"}
      - {name: symbol_leading_char, purpose: "'_' on some targets"}
      - {name: ar_pad_char, purpose: "pad character in an archive header"}
      - {name: ar_max_namelen, purpose: "max chars in an archive member name"}
      - {name: match_priority, purpose: "lower wins when several targets match"}
    byte_order_slots:
      data: "bfd_getx64/16/32, bfd_putx64/16/32, plus signed variants"
      header: "bfd_h_getx64/16/32, bfd_h_putx64/16/32, plus signed variants"
      lesson: >-
        BFD keeps TWO byte orders: one for file data and one for headers.
        A reader should distinguish target header/data order from the order
        of nested structures. Archive indices, for example, have their own
        byte-order rules even when the member objects are little-endian.
    jump_table_groups:
      - {name: GENERIC, slots: [close_and_cleanup, bfd_free_cached_info, new_section_hook, get_section_contents, get_section_contents_in_window]}
      - {name: COPY, slots: [bfd_copy_private_bfd_data, bfd_merge_private_bfd_data, _bfd_generic_init_private_section_data, bfd_copy_private_section_data, bfd_copy_private_symbol_data, bfd_copy_private_header_data, bfd_set_private_flags, bfd_print_private_bfd_data]}
      - {name: CORE, slots: [core_file_failing_command, core_file_failing_signal, core_file_matches_executable_p, core_file_pid]}
      - {name: ARCHIVE, slots: [slurp_armap, slurp_extended_name_table, construct_extended_name_table, truncate_arname, write_armap, read_ar_hdr, write_ar_hdr, openr_next_archived_file, get_elt_at_index, generic_stat_arch_elt, update_armap_timestamp]}
      - {name: SYMBOLS, slots: [get_symtab_upper_bound, canonicalize_symtab, make_empty_symbol, print_symbol, get_symbol_info, bfd_is_local_label_name, bfd_is_target_special_symbol, get_lineno, find_nearest_line, _bfd_generic_find_line, find_inliner_info, bfd_make_debug_symbol, read_minisymbols, minisymbol_to_symbol]}
      - {name: RELOCS, slots: [get_reloc_upper_bound, canonicalize_reloc, bfd_reloc_type_lookup, bfd_reloc_name_lookup]}
      - {name: WRITE, slots: [set_arch_mach, set_section_contents]}
      - {name: LINK, slots: [sizeof_headers, bfd_get_relocated_section_contents, bfd_relax_section, bfd_link_hash_table_create, bfd_link_hash_table_free, bfd_link_add_symbols, bfd_link_just_syms, bfd_copy_link_hash_symbol_type, bfd_final_link, bfd_link_split_section, bfd_gc_sections, bfd_lookup_section_flags, bfd_merge_sections, bfd_is_group_section, bfd_discard_group, section_already_linked, bfd_define_common_symbol]}
      - {name: DYNAMIC, slots: [get_dynamic_symtab_upper_bound, canonicalize_dynamic_symtab, get_synthetic_symtab, get_dynamic_reloc_upper_bound, canonicalize_dynamic_reloc]}
    slot_naming: "Names are the suffixes used by BFD_JUMP_TABLE_* macros; the two _bfd_generic_* entries are fixed rather than NAME-prefixed."
    per_format_vectors:
      check_format: "const bfd_target *(*_bfd_check_format[bfd_type_end])(bfd *);  bfd/bfd-in2.h:5849"
      set_format: "bfd_boolean (*_bfd_set_format[bfd_type_end])(bfd *);  bfd/bfd-in2.h:5852"
      write_contents: "bfd_boolean (*_bfd_write_contents[bfd_type_end])(bfd *);  bfd/bfd-in2.h:5855"
      lesson: >-
        The three per-format vectors are indexed by `bfd_format`, so one
        target can serve several formats (a PE target serves bfd_object and
        bfd_archive). qBFD instead has one `ObjectFile` subclass per format
        and a separate `Archive` type.

  format_dispatch:
    entry_points:
      - {name: bfd_check_format, source: "bfd/format.c:92-96"}
      - {name: bfd_check_format_matches, source: "bfd/format.c:118-357"}
      - {name: bfd_set_format, source: "bfd/format.c:373-396"}
    algorithm:
      - "An explicit target is tried first. If it fails, this version usually falls through to other targets; explicitly checking binary as an archive is the exception (bfd/format.c:167-191)."
      - "Search registered targets, skipping binary, an already-tested explicit target, and candidates with worse match_priority than the best match (bfd/format.c:193-256)."
      - "Each candidate is asked to rewind to offset 0 and identify itself (bfd/format.c:206-207, 215)."
      - "A backend that does not set an error is assumed to have said wrong_format (bfd/format.c:213)."
      - "A match is recorded; the lowest match_priority wins (bfd/format.c:234-239)."
      - "After priority and association resolution, one candidate succeeds; zero yields file_not_recognized and unresolved multiplicity yields file_ambiguously_recognized. Other backend errors can terminate the search early (bfd/format.c:254-356)."
      - "Partial matches (archive with no index, objects of the wrong type, or a backend-reported ambiguity) are used only if no full match exists (bfd/format.c:241-279)."
    ambiguity_resolution:
      default_target_wins: "If the default target matched, it is accepted immediately, even if others also match (bfd/format.c:224-228)."
      associated_vector: "bfd_associated_vector can disambiguate a multiple match (bfd/format.c:281-299)."
      binary_target_is_excluded: "The `binary` target never participates in automatic detection (bfd/format.c:199-202)."
    error_codes:
      source: bfd/bfd-in2.h:5500-5524
      values:
        no_error: 0
        system_call: 1
        invalid_target: 2
        wrong_format: 3
        wrong_object_format: 4
        invalid_operation: 5
        no_memory: 6
        no_symbols: 7
        no_armap: 8
        no_more_archived_files: 9
        malformed_archive: 10
        file_not_recognized: 11
        file_ambiguously_recognized: 12
        no_contents: 13
        nonrepresentable_section: 14
        no_debug_section: 15
        bad_value: 16
        file_truncated: 17
        file_too_big: 18
        on_input: 19
        invalid_error_code: 20
    lesson_for_qbfd: >-
      Distinguish a rejected candidate from malformed input, I/O failure and
      unresolved ambiguity. qBFD's Error::Code provides UnknownFormat,
      Ambiguous, Malformed, Unsupported and OutOfRange alongside None,
      FileNotFound and IoError (qBFDCore.hpp:29-38).

  error_handling:
    model: "A global bfd_error_type, plus input-BFD and underlying-error context for bfd_error_on_input (bfd/bfd.c:392-394,453-477)."
    functions:
      - {name: bfd_get_error, source: "bfd/bfd.c:432"}
      - {name: bfd_set_error, source: "bfd/bfd.c:452"}
      - {name: bfd_errmsg, source: "bfd/bfd.c:483"}
      - {name: bfd_perror, source: "bfd/bfd.c:526"}
      - {name: _bfd_default_error_handler, source: "bfd/bfd.c:581"}
    lesson: >-
      A global error slot can be overwritten by later calls. qBFD's
      Expected<T> carries the error with the result. That difference alone
      does not establish thread safety for either library's other state.

  symbol_hash_table:
    source: bfd/hash.c
    functions:
      - {name: bfd_hash_table_init, source: "bfd/hash.c:411"}
      - {name: bfd_hash_table_init_n, source: "bfd/hash.c:369"}
      - {name: bfd_hash_lookup, source: "bfd/hash.c:457-497"}
      - {name: bfd_hash_insert, source: "bfd/hash.c:502-562"}
      - {name: bfd_hash_traverse, source: "bfd/hash.c:644-661"}
    properties:
      - "Separate chaining: buckets point to linked bfd_hash_entry lists. Lookup uses bfd_hash_hash and strcmp, not caller-supplied hash/equality callbacks (bfd/hash.c:430-475)."
      - "The caller supplies an entry-construction callback, newfunc, which supports larger backend-specific entries (bfd/hash.c:369-405,509-516)."
      - "create controls insertion on a miss; copy controls whether a newly inserted name is copied into the table's objalloc arena (bfd/hash.c:478-496)."
      - "Insertion tries to grow above 75 percent occupancy, using a larger prime bucket count. If growth is impossible, the inserted entry remains and the table freezes growth (bfd/hash.c:519-559)."
      - "Traversal freezes growth while visiting chains; returning FALSE from the visitor stops traversal (bfd/hash.c:644-661)."
    lesson: >-
      These are general string-key tables, also used for section names.
      A canonical symbol array and a linker name-resolution hash are
      different data structures with different ownership and lookup needs.

  lifecycle:
    allocation:
      source: bfd/opncls.c:59-159
      functions: [_bfd_new_bfd, _bfd_new_bfd_contained_in, _bfd_delete_bfd, _bfd_free_cached_info]
      findings:
        - "A new handle starts with bfd_unknown, no_direction, default architecture information and an empty section-name hash with 251 buckets."
        - "Each handle has an objalloc arena. The section-name hash also owns an arena; deletion releases both."
        - "A contained archive handle inherits xvec, iovec and target_defaulted, points my_archive at the container and starts in read_direction."
        - "_bfd_free_cached_info clears sections, outsymbols, tdata and usrdata after releasing arena storage; previously borrowed metadata becomes invalid."
    opening:
      sources: ["bfd/opncls.c:196-277", "bfd/opncls.c:293-340", "bfd/opncls.c:357-384"]
      functions: [bfd_fopen, bfd_openr, bfd_fdopenr, bfd_openstreamr]
      findings:
        - "Opening selects an initial target and I/O source; format recognition is a later bfd_check_format operation."
        - "bfd_fopen stores the filename pointer rather than copying the string. Its lifetime must cover later uses, including cache reopening."
        - "A file opened by pathname is cacheable. A supplied descriptor is non-cacheable by default because reopening might lose its special flags."
        - "bfd_fdopenr and bfd_openstreamr transfer eventual close responsibility for the descriptor or stream to the BFD."
    custom_streams:
      source: bfd/opncls.c:391-585
      function: bfd_openr_iovec
      findings:
        - "A read-only adapter uses application open, pread, close and stat callbacks. The pread callback receives an explicit offset."
        - "The adapter maintains a logical cursor; reads advance it by the number of bytes actually returned. Short EOF reads are allowed."
        - "Its write operation returns -1 and its mmap operation returns (void *) -1. The close callback is optional."
    closing:
      source: bfd/opncls.c:693-759
      findings:
        - "bfd_close first dispatches write_contents for writable handles, then closes nested thin archives, runs backend cleanup, closes I/O and deletes the handle."
        - "A failed write_contents or close_and_cleanup callback returns early; the function has not yet reached handle deletion."
        - "bfd_close_all_done skips pending output and backend write finalization, closes through the file cache, and deletes the handle. It is not equivalent to flushing output."
    arena_allocation:
      source: bfd/opncls.c:909-1027
      functions: [bfd_alloc, bfd_alloc2, bfd_zalloc, bfd_zalloc2, bfd_release]
      findings:
        - "bfd_alloc attaches storage to the handle; bfd_zalloc additionally zeroes it."
        - "The two-argument element allocators check multiplication overflow before allocating nmemb * size."
        - "bfd_release rolls back the arena at a block, also releasing more recently allocated blocks; it is not an independent free of just that block."
    memory_output:
      source: bfd/opncls.c:776-894
      sequence: [bfd_create, bfd_make_writable, bfd_make_readable]
      findings:
        - "bfd_create selects object format without opening a file. bfd_make_writable installs BFD_IN_MEMORY and the memory I/O vector."
        - "bfd_make_readable finalizes output into that buffer, resets parsing state, switches direction and invokes object recognition again."
        - "This implementation ignores the return from the final bfd_check_format call and returns TRUE; that return alone does not certify successful re-parsing."
    implementation_lessons:
      status: "Design guidance inferred from these source paths."
      items:
        - "Separate byte-storage ownership, parsed-metadata lifetime and finalization status in a new implementation."
        - "Keep opening and recognition distinct so a failed parser can discard its own state without destroying shared input bytes."

  io_and_file_cache:
    dispatch:
      source: bfd/bfdio.c:136-174
      iovec_operations: [bread, bwrite, btell, bseek, bclose, bflush, bstat, bmmap]
      finding: "I/O strategy is separate from object-format strategy; a backend reads through the handle's iovec."
    reads_and_positions:
      source: bfd/bfdio.c:179-345
      findings:
        - "bfd_bread clips archive-member reads to arelt_data.parsed_size and updates where by the bytes actually read."
        - "bfd_seek accepts SEEK_SET and SEEK_CUR, not SEEK_END. An archive-member SEEK_SET adds origin before delegating to the I/O vector."
        - "bfd_tell subtracts origin for contained handles, exposing member-relative positions."
        - "Archive members share a stream position, so the ordinary same-position seek shortcut is disabled for archive access."
        - "On seek failure, EINVAL maps to file_truncated; other failures map to system_call, preserving errno."
        - "bfd_bwrite reports a short write as system_call."
    file_size:
      source: bfd/bfdio.c:378-423
      finding: >-
        bfd_get_size returns the backing stream's stat size. Its documented
        purpose is a plausibility bound for reads, not an exact logical size
        for every object, especially archive members.
    cache:
      source: bfd/cache.c:25-229
      max_open_threshold: 10
      findings:
        - "This is an LRU cache of FILE streams, not a cache of section bytes."
        - "Eviction scans for the least-recently-used cacheable handle, saves its position, closes its stream and retains its parsed handle."
        - "A later lookup reopens the pathname and normally restores the saved position. Archive-member lookups use the parent handle."
        - "The threshold is not an absolute descriptor cap: close_one succeeds without eviction when no cacheable stream is available."
    memory_io:
      source: bfd/bfdio.c:458-505
      findings:
        - "Memory reads clip to the buffer and set file_truncated on short reads."
        - "Memory writes grow storage, rounding allocation to 128-byte boundaries."
    implementation_lessons:
      status: "Design guidance inferred from these source paths."
      items:
        - "Use member-relative offsets and an explicit member length rather than relying on the containing archive's file size."
        - "Validate offset <= size and length <= size - offset before access; avoid overflow-prone offset + length comparisons."
        - "Treat a short read separately from successful decoding of a complete record."

  section_operations:
    identity_and_names:
      sources: ["bfd/section.c:780-925", "bfd/section.c:1000-1195"]
      findings:
        - "Section initialization assigns an index from section_count, records owner, invokes the target's new_section_hook and appends to the list."
        - "The generic new-section hook creates a zero-valued BSF_SECTION_SYM symbol tied to the section."
        - "Names are not unique identities. bfd_make_section_anyway_with_flags explicitly permits duplicate names and chains them in the section hash."
        - "bfd_make_section_old_way returns an existing section for a duplicate; bfd_make_section_with_flags instead returns NULL without setting an error for an existing name."
        - "bfd_get_section_by_name returns one match. bfd_get_section_by_name_if can traverse same-name entries; bfd_map_over_sections visits the full list."
        - "Constructors retain the name pointer; they do not request a name copy from the hash table."
    pseudo_sections:
      source: bfd/section.c:1010-1042
      names: ["*ABS*", "*COM*", "*UND*", "*IND*"]
      finding: "Absolute, common, undefined and indirect symbols use distinguished section objects rather than ordinary input-section indices."
    contents:
      source: bfd/section.c:1456-1511
      findings:
        - "Constructor sections return zero-filled requested contents immediately."
        - "For other sections, bounds use rawsize when reading and rawsize is nonzero; otherwise they use size. A zero-length request succeeds after the bounds check."
        - "A section without SEC_HAS_CONTENTS returns zero-filled bytes, not an empty read."
        - "SEC_IN_MEMORY reads copy from section.contents. A missing contents pointer clears that flag and reports invalid_operation."
        - "Remaining reads dispatch to the backend get_section_contents callback."
      qbfd_comparison:
        source: qCOFF.hpp:352-362
        finding: "COFFFile::sectionContents returns an empty span for BSS. This raw-file view differs from BFD's synthesized zero-filled contents."
    output_state:
      source: bfd/section.c:1345-1431
      findings:
        - "Setting size is rejected after output_has_begun; the section constructors enforce the same phase boundary."
        - "Writing requires SEC_HAS_CONTENTS, a valid range and a writable handle. A successful backend write sets output_has_begun."
        - "A rewriter should settle section layout before writing payloads, preserving the relationship between section geometry and later tables."
    flag_setter:
      source: bfd/section.c:1219-1225
      finding: "Despite the surrounding API description, this setter simply assigns the flags and returns TRUE; it performs no target-mask validation."

  canonical_symbols:
    read_protocol:
      sources: ["bfd/syms.c:28-94", "bfd/syms.c:346-355", "bfd/syms.c:421-431"]
      findings:
        - "The upper-bound query reports bytes needed for an asymbol pointer vector, including its terminating NULL; it does not return a symbol count."
        - "The caller allocates that vector, then canonicalize_symtab populates pointers and returns the count excluding the terminator."
        - "The canonical symbols belong to BFD-managed storage; freeing the caller's vector does not free those symbols. Closing the owning handle invalidates them."
        - "Canonicalization can trigger deferred native-table reading. Backends may retain extra native information not represented by asymbol."
    output_protocol:
      source: bfd/syms.c:450-461
      finding: "bfd_set_symtab attaches the supplied pointer vector and count to an output object. It does not deep-copy the symbols or their names."
    minisymbols:
      source: bfd/syms.c:791-847
      findings:
        - "The generic implementation chooses static or dynamic canonicalization using the dynamic argument."
        - "Its minisymbol record is just an asymbol pointer, with size sizeof(asymbol *). A backend can supply a more compact representation."
        - "The generic conversion returns the existing pointed-to symbol and ignores the caller's scratch symbol."
    nm_classification:
      source: bfd/syms.c:661-766
      cases:
        common: "C"
        undefined: "U"
        undefined_weak_object: "v"
        undefined_weak_other: "w"
        defined_weak_object: "V"
        defined_weak_other: "W"
        indirect_section: "I"
        gnu_indirect_function: "i"
        gnu_unique: "u"
      findings:
        - "For ordinary defined symbols, section-name and section-flag classification determines a letter; BSF_GLOBAL uppercases it."
        - "bfd_is_undefined_symclass recognizes U, w and v. bfd_symbol_info reports zero for those and symbol.value + section.vma for the other classes."
        - "GNU IFUNC and indirect/alias symbols are different concepts: BSF_GNU_INDIRECT_FUNCTION is distinct from BSF_INDIRECT."

  relocation_engine:
    canonicalization:
      source: bfd/bfd.c:824-895
      findings:
        - "get_reloc_upper_bound and canonicalize_reloc require bfd_object and otherwise return -1 with invalid_operation."
        - "The upper bound is storage in bytes; canonicalization writes an arelent pointer vector and returns a relocation count. It also takes the symbol-pointer table."
        - "bfd_set_reloc merely attaches an output relocation pointer vector and count to the section. It neither decodes nor applies entries."
    descriptor_width:
      source: bfd/reloc.c:299-302,432-445
      size_code_to_bytes: {0: 1, 1: 2, 2: 4, 3: 0, 4: 8, 8: 16, -2: 4}
      findings:
        - "howto.size is a code, not log2(bytes); bitsize is a separate significant-field/overflow width."
        - "Knowing a storage width is not enough to apply a relocation. Shifts, masks, sign rules and target callbacks are also part of its meaning."
    generic_application:
      source: bfd/reloc.c:574-695
      function: bfd_perform_relocation
      findings:
        - "sym_ptr_ptr references an asymbol pointer. The byte-buffer offset is address multiplied by bfd_octets_per_byte."
        - "For final relocation, an undefined non-weak symbol sets bfd_reloc_undefined; an undefined weak symbol is permitted."
        - "The special_function runs before generic processing. Any result other than bfd_reloc_continue returns immediately."
        - "The generic value starts from the symbol (zero for common), output placement and addend. PC-relative processing subtracts the input output-section base and, when pcrel_offset is set, the relocation address."
        - "For relocatable output with partial_inplace false, BFD updates the relocation addend and address and returns without modifying section bytes."
    field_application:
      source: bfd/reloc.c:1377-1544
      function: _bfd_relocate_contents
      findings:
        - "Read the storage unit using target byte order; a negative size code negates the supplied relocation value."
        - "Check the selected signed, unsigned or bitfield overflow policy; shift the relocation and merge only the destination-mask bits, incorporating any source-mask addend."
        - "Bits outside dst_mask are preserved. The function writes back the result even when it returns bfd_reloc_overflow."
        - "This helper handles 1, 2, 4 and, with BFD64, 8-byte units. A width recognized by bfd_get_reloc_size does not guarantee this helper supports it."
    rel_addends:
      source: bfd/reloc.c:330-354
      finding: >-
        partial_inplace describes partial-link behavior as well as addend
        location. The comments explicitly warn that not every REL relocation
        sets it TRUE. src_mask normally extracts an in-place addend for REL;
        RELA normally uses a zero src_mask. Backend exceptions must be read
        rather than inferred solely from the file class or architecture.
    implementation_lessons:
      status: "Design guidance inferred from these source paths."
      items:
        - "Keep relocation metadata separate from the set of encodings an implementation can safely apply."
        - "Check the entire field range, not just its starting address, before reading or writing."
        - "If an API promises no mutation on error, compute and validate first; do not copy BFD's write-on-overflow behavior accidentally."

  target_and_architecture:
    target_selection:
      source: bfd/targets.c:1388-1499
      findings:
        - "An explicit target name takes precedence over GNUTARGET. With neither, or with the name default, use the configured default vector or the first registered vector and set target_defaulted."
        - "Name lookup first tries exact target names, then configuration-triplet wildcard matches; a miss sets invalid_target."
        - "Selecting a target vector is separate from recognizing object, archive or core contents."
    compatibility:
      source: bfd/archures.c:762-786,940-956
      findings:
        - "Known architectures delegate compatibility to the architecture-specific callback."
        - "An unknown architecture is accepted only with accept_unknowns or for an explicitly selected binary target."
        - "The default callback rejects different architecture families or bits_per_word, then returns the descriptor with the larger machine number. Targets may override it."
    address_units:
      source: bfd/archures.c:1258-1300
      finding: >-
        A target byte is a minimum addressable unit and need not be eight
        bits. The octets-per-byte result is bits_per_byte / 8 when the
        architecture is known, otherwise 1. Distinguish file octets from
        target addresses when extending a reader to DSP-style targets.

# ---------------------------------------------------------------------------
# 2. ELF
# ---------------------------------------------------------------------------
formats:
  elf:
    files: ["bfd/elf.c", "bfd/elfcode.h", "bfd/elf-bfd.h", "bfd/elfxx-target.h"]
    note: "elfcode.h is the template; it is compiled twice, once per class (elf32.c, elf64.c)."

    detection:
      entry_point: "bfd_elfNN_object_p, generated from elf_object_p in bfd/elfcode.h:488-864"
      magic:
        bytes: [0x7f, 0x45, 0x4c, 0x46]
        spellings: "7F 'E' 'L' 'F'"
        source: "bfd/elfcode.h:471-478; include/elf/common.h:37-47"
      checks_in_order:
        - {step: 1, check: "Read a whole Elf_External_Ehdr; a short read is wrong_format unless the read itself failed", source: "bfd/elfcode.h:507"}
        - {step: 2, check: "e_ident[EI_MAG0..3] == 7F 'E' 'L' 'F'", source: "bfd/elfcode.h:521"}
        - {step: 3, check: "e_ident[EI_VERSION] == EV_CURRENT (1)", source: "bfd/elfcode.h:522"}
        - {step: 4, check: "e_ident[EI_CLASS] == ELFCLASS32 (1) or ELFCLASS64 (2)", source: "bfd/elfcode.h:523"}
        - {step: 5, check: "e_ident[EI_DATA] is ELFDATA2LSB (1) or ELFDATA2MSB (2), and matches the target's byte order", source: "bfd/elfcode.h:527-540"}
        - {step: 6, check: "e_type != ET_CORE", source: "bfd/elfcode.h:562"}
        - {step: 7, check: "e_shoff != 0 when e_type == ET_REL", source: "bfd/elfcode.h:563"}
        - {step: 8, check: "e_shentsize == sizeof(ElfNN_External_Shdr) unless e_shnum == 0", source: "bfd/elfcode.h:573-574"}
        - {step: 9, check: "e_shoff == 0 implies e_shnum == 0", source: "bfd/elfcode.h:577-578"}
        - {step: 10, check: "target arch_size matches", source: "bfd/elfcode.h:580-582"}
        - {step: 11, check: "e_machine matches the target, or one of two alternates, or the target is EM_NONE", source: "bfd/elfcode.h:586-592"}
        - {step: 12, check: "e_ident[EI_OSABI] matches the target's OSABI, unless the target's OSABI is ELFOSABI_NONE", source: "bfd/elfcode.h:609-612"}
        - {step: 13, check: "e_shnum / e_shstrndx / e_phnum extended-numbering fields", source: "bfd/elfcode.h:633-655"}
        - {step: 14, check: "sh_link and sh_info are in range for the section they index", source: "bfd/elfcode.h:714-741"}
        - {step: 15, check: "e_shstrndx is a valid section index", source: "bfd/elfcode.h:756-771"}
      not_checked:
        - "The generic elf_object_p path does not validate e_ident[EI_ABIVERSION] (index 8); target-specific hooks require separate review."
        - "That generic path checks EI_VERSION but does not independently validate the 32-bit e_version field at offset 0x14."
      failure_modes:
        wrong_format: "bfd_error_wrong_format (bfd/elfcode.h:848-863, got_wrong_format_error)"
        no_match: "return NULL, restoring any preserved state"

    e_ident:
      size: 16
      source: include/elf/internal.h:66
      bytes:
        - {index: 0, name: EI_MAG0, value: 0x7f}
        - {index: 1, name: EI_MAG1, value: "0x45 'E'"}
        - {index: 2, name: EI_MAG2, value: "0x4c 'L'"}
        - {index: 3, name: EI_MAG3, value: "0x46 'F'"}
        - {index: 4, name: EI_CLASS, values: {ELFCLASSNONE: 0, ELFCLASS32: 1, ELFCLASS64: 2}}
        - {index: 5, name: EI_DATA, values: {ELFDATANONE: 0, ELFDATA2LSB: 1, ELFDATA2MSB: 2}}
        - {index: 6, name: EI_VERSION, values: {EV_NONE: 0, EV_CURRENT: 1}}
        - {index: 7, name: EI_OSABI, values: {ELFOSABI_NONE: 0, ELFOSABI_HPUX: 1, ELFOSABI_NETBSD: 2, ELFOSABI_GNU: 3, ELFOSABI_SOLARIS: 6, ELFOSABI_AIX: 7, ELFOSABI_IRIX: 8, ELFOSABI_FREEBSD: 9, ELFOSABI_TRU64: 10, ELFOSABI_MODESTO: 11, ELFOSABI_OPENBSD: 12, ELFOSABI_OPENVMS: 13, ELFOSABI_NSK: 14, ELFOSABI_AROS: 15, ELFOSABI_FENIXOS: 16, ELFOSABI_ARM: 97, ELFOSABI_STANDALONE: 255}}
        - {index: 8, name: EI_ABIVERSION, note: "not checked by BFD"}
        - {index: 9, name: EI_PAD, note: "padding to index 15"}

    headers:
      note: >-
        BFD never uses the naturally-aligned host structs. It uses
        byte-array `Elf*_External_*` structs that are exactly the on-disk
        layout (include/elf/external.h). The sizes below are those packed
        layouts, NOT the host <elf.h> sizes.
      ehdr:
        structs:
          - {struct: Elf32_External_Ehdr, size: 52, source: "include/elf/external.h:53-68"}
          - {struct: Elf64_External_Ehdr, size: 64, source: "include/elf/external.h:70-85"}
        fields:
          - {field: e_ident, type: "u8[16]", off32: 0, off64: 0}
          - {field: e_type, type: u16, off32: 16, off64: 16}
          - {field: e_machine, type: u16, off32: 18, off64: 18}
          - {field: e_version, type: u32, off32: 20, off64: 20}
          - {field: e_entry, type: "u32/u64 addr", off32: 24, off64: 24}
          - {field: e_phoff, type: "u32/u64 off", off32: 28, off64: 32}
          - {field: e_shoff, type: "u32/u64 off", off32: 32, off64: 40}
          - {field: e_flags, type: u32, off32: 36, off64: 48}
          - {field: e_ehsize, type: u16, off32: 40, off64: 52, note: "52 for ELF32, 64 for ELF64"}
          - {field: e_phentsize, type: u16, off32: 42, off64: 54}
          - {field: e_phnum, type: u16, off32: 44, off64: 56}
          - {field: e_shentsize, type: u16, off32: 46, off64: 58}
          - {field: e_shnum, type: u16, off32: 48, off64: 60}
          - {field: e_shstrndx, type: u16, off32: 50, off64: 62}
      shdr:
        structs:
          - {struct: Elf32_External_Shdr, size: 40, source: "include/elf/external.h:113-124"}
          - {struct: Elf64_External_Shdr, size: 64, source: "include/elf/external.h:126-137"}
        fields:
          - {field: sh_name, type: u32, off32: 0, off64: 0}
          - {field: sh_type, type: u32, off32: 4, off64: 4}
          - {field: sh_flags, type: "u32/u64", off32: 8, off64: 8}
          - {field: sh_addr, type: "u32/u64", off32: 12, off64: 16}
          - {field: sh_offset, type: "u32/u64", off32: 16, off64: 24}
          - {field: sh_size, type: "u32/u64", off32: 20, off64: 32}
          - {field: sh_link, type: u32, off32: 24, off64: 40, note: "u32 in BOTH variants"}
          - {field: sh_info, type: u32, off32: 28, off64: 44, note: "u32 in BOTH variants"}
          - {field: sh_addralign, type: "u32/u64", off32: 32, off64: 48}
          - {field: sh_entsize, type: "u32/u64", off32: 36, off64: 56}
      phdr:
        structs:
          - {struct: Elf32_External_Phdr, size: 32, source: "include/elf/external.h:89-98"}
          - {struct: Elf64_External_Phdr, size: 56, source: "include/elf/external.h:100-109"}
        gotcha: >-
          In ELF64 the field order differs from ELF32: p_flags is the SECOND
          field (offset 4), immediately after p_type. In ELF32 p_flags sits
          between p_memsz and p_align (offset 24). BFD's internal
          Elf_Internal_Phdr normalises the order; the external structs do not.
        fields:
          - {field: p_type, type: u32, off32: 0, off64: 0}
          - {field: p_flags, type: u32, off32: 24, off64: 4}
          - {field: p_offset, type: "u32/u64", off32: 4, off64: 8}
          - {field: p_vaddr, type: "u32/u64", off32: 8, off64: 16}
          - {field: p_paddr, type: "u32/u64", off32: 12, off64: 24}
          - {field: p_filesz, type: "u32/u64", off32: 16, off64: 32}
          - {field: p_memsz, type: "u32/u64", off32: 20, off64: 40}
          - {field: p_align, type: "u32/u64", off32: 28, off64: 48}
      sym:
        structs:
          - {struct: Elf32_External_Sym, size: 16, source: "include/elf/external.h:141-148"}
          - {struct: Elf64_External_Sym, size: 24, source: "include/elf/external.h:150-157"}
        gotcha: >-
          ELF64 reorders the symbol fields: st_name, st_info, st_other,
          st_shndx, st_value, st_size. st_value and st_size are LAST in
          ELF64, not second and third as in ELF32.
        fields:
          - {field: st_name, type: u32, off32: 0, off64: 0}
          - {field: st_value, type: "u32/u64", off32: 4, off64: 8}
          - {field: st_size, type: "u32/u64", off32: 8, off64: 16}
          - {field: st_info, type: u8, off32: 12, off64: 4}
          - {field: st_other, type: u8, off32: 13, off64: 5}
          - {field: st_shndx, type: u16, off32: 14, off64: 6}
      rel:
        structs:
          - {struct: Elf32_External_Rel, size: 8, source: "include/elf/external.h:173-176"}
          - {struct: Elf64_External_Rel, size: 16, source: "include/elf/external.h:184-187"}
        fields:
          - {field: r_offset, type: "u32/u64", off32: 0, off64: 0}
          - {field: r_info, type: "u32/u64", off32: 4, off64: 8}
      rela:
        structs:
          - {struct: Elf32_External_Rela, size: 12, source: "include/elf/external.h:178-182"}
          - {struct: Elf64_External_Rela, size: 24, source: "include/elf/external.h:189-193"}
        fields:
          - {field: r_offset, type: "u32/u64", off32: 0, off64: 0}
          - {field: r_info, type: "u32/u64", off32: 4, off64: 8}
          - {field: r_addend, type: "s32/s64", off32: 8, off64: 16, note: "SIGNED in both variants"}
      dyn:
        structs:
          - {struct: Elf32_External_Dyn, size: 8, source: "include/elf/external.h:197-203"}
          - {struct: Elf64_External_Dyn, size: 16, source: "include/elf/external.h:205-211"}
        fields:
          - {field: d_tag, type: "s32/s64", off32: 0, off64: 0}
          - {field: d_un.d_val / d_un.d_ptr, type: "u32/u64", off32: 4, off64: 8}
    extended_numbering:
      rules:
        - {field: e_shnum, sentinel: "SHN_UNDEF (0)", real_value_in: "section header 0, sh_size", source: "bfd/elfcode.h:633-639"}
        - {field: e_shstrndx, sentinel: "0xffff", real_value_in: "section header 0, sh_link", source: "bfd/elfcode.h:642-647"}
        - {field: e_phnum, sentinel: "PN_XNUM (0xffff)", real_value_in: "section header 0, sh_info", source: "bfd/elfcode.h:650-655"}
        - {field: st_shndx, sentinel: "SHN_XINDEX (0xffff)", real_value_in: "the parallel SHT_SYMTAB_SHNDX table", source: "bfd/elfcode.h:193-200"}
      write_back:
        - "e_shnum is written as 0; the real count goes to shdr[0].sh_size (bfd/elfcode.h:1032-1033)."
        - "e_shstrndx is written as 0xffff; the real index goes to shdr[0].sh_link (bfd/elfcode.h:1034-1035)."
        - "e_phnum is clamped to PN_XNUM; the real count goes to shdr[0].sh_info (bfd/elfcode.h:1030-1031)."

    section_types:
      source: include/elf/common.h:443-487
      values:
        SHT_NULL: 0
        SHT_PROGBITS: 1
        SHT_SYMTAB: 2
        SHT_STRTAB: 3
        SHT_RELA: 4
        SHT_HASH: 5
        SHT_DYNAMIC: 6
        SHT_NOTE: 7
        SHT_NOBITS: 8
        SHT_REL: 9
        SHT_SHLIB: 10
        SHT_DYNSYM: 11
        SHT_INIT_ARRAY: 14
        SHT_FINI_ARRAY: 15
        SHT_PREINIT_ARRAY: 16
        SHT_GROUP: 17
        SHT_SYMTAB_SHNDX: 18
        SHT_GNU_ATTRIBUTES: "0x6ffffff5"
        SHT_GNU_HASH: "0x6ffffff6"
        SHT_GNU_LIBLIST: "0x6ffffff7"
        SHT_GNU_verdef: "0x6ffffffd"
        SHT_GNU_verneed: "0x6ffffffe"
        SHT_GNU_versym: "0x6fffffff"
        SHT_LOOS: "0x60000000"
        SHT_HIOS: "0x6fffffff"
        SHT_LOPROC: "0x70000000"
        SHT_HIPROC: "0x7fffffff"
        SHT_LOUSER: "0x80000000"
        SHT_HIUSER: "0xffffffff"
      gaps:
        - "12 and 13 are unused."
        - "SHT_RELR (19) does not exist in this vintage."
      bfd_name_table:
        note: "BFD ships a short name array covering only types 0-11."
        source: bfd/elf.c:1084-1088

    section_flags:
      source: include/elf/common.h:489-513
      values:
        SHF_WRITE: 0x00000001
        SHF_ALLOC: 0x00000002
        SHF_EXECINSTR: 0x00000004
        SHF_MERGE: 0x00000010
        SHF_STRINGS: 0x00000020
        SHF_INFO_LINK: 0x00000040
        SHF_LINK_ORDER: 0x00000080
        SHF_OS_NONCONFORMING: 0x00000100
        SHF_GROUP: 0x00000200
        SHF_TLS: 0x00000400
        SHF_EXCLUDE: 0x80000000
      absent: "SHF_COMPRESSED does not exist in this tree; BFD 2.22 uses the .zdebug naming convention (bfd/elf.c:1010-1079)."

    special_indices:
      external:
        source: include/elf/external.h:41-49
        values:
          SHN_LORESERVE: "0xff00"
          SHN_ABS: "0xfff1"
          SHN_COMMON: "0xfff2"
          SHN_XINDEX: "0xffff"
          SHN_HIRESERVE: "0xffff"
        note: "SHN_UNDEF (0) is not in external.h; it is defined in include/elf/internal.h:52."
      internal:
        source: include/elf/internal.h:52-62
        note: "BFD converts the reserved range to negative unsigned values so comparisons work."
        values:
          SHN_UNDEF: 0
          SHN_LORESERVE: "-0x100"
          SHN_ABS: "-0x0f"
          SHN_COMMON: "-0x0e"
          SHN_XINDEX: "-0x01"
          SHN_BAD: "-0x101"
      lesson: >-
        A reimplementation should keep the on-disk values and compare
        against them directly. qBFD's `Symbol::section` is empty for
        undefined and absolute symbols (qBFDCore.hpp:171), which reproduces
        the intent without the negative-value trick.

    segment_types:
      source: include/elf/common.h:405-513
      values:
        PT_NULL: 0
        PT_LOAD: 1
        PT_DYNAMIC: 2
        PT_INTERP: 3
        PT_NOTE: 4
        PT_SHLIB: 5
        PT_PHDR: 6
        PT_TLS: 7
        PT_GNU_EH_FRAME: "0x6474e550"
        PT_GNU_STACK: "0x6474e551"
        PT_GNU_RELRO: "0x6474e552"
      segment_flags:
        PF_X: 1
        PF_W: 2
        PF_R: 4

    symbols:
      st_info_decomposition:
        source: include/elf/common.h:615-617
        macros:
          ELF_ST_BIND: "(val) >> 4"
          ELF_ST_TYPE: "val & 0xf"
        source_st_other: "ELF_ST_VISIBILITY(v) = v & 0x3  (include/elf/common.h:631)"
      bindings:
        source: include/elf/common.h:641-648
        values: {STB_LOCAL: 0, STB_GLOBAL: 1, STB_WEAK: 2, STB_LOOS: 10, STB_GNU_UNIQUE: 10, STB_HIOS: 12, STB_LOPROC: 13, STB_HIPROC: 15}
      types:
        source: include/elf/common.h:650-663
        values:
          STT_NOTYPE: 0
          STT_OBJECT: 1
          STT_FUNC: 2
          STT_SECTION: 3
          STT_FILE: 4
          STT_COMMON: 5
          STT_TLS: 6
          STT_RELC: 8
          STT_SRELC: 9
          STT_GNU_IFUNC: 10
      visibility:
        source: include/elf/common.h:668-671
        values: {STV_DEFAULT: 0, STV_INTERNAL: 1, STV_HIDDEN: 2, STV_PROTECTED: 3}
      symtab_contract:
        - "Index 0 of a symbol table is the undefined symbol and is not a real entry."
        - "sh_info of an SHT_SYMTAB is the index of the first global symbol; all locals precede it (bfd/elf.c:1648-1649)."
        - "The string table index 0 is the empty string, and the table's byte 0 must be a NUL."

    relocations:
      r_info_split:
        source: include/elf/common.h:675-681
        elf32: {sym: "(i) >> 8", type: "(i) & 0xff", note: "8-bit type field"}
        elf64: {sym: "(i) >> 32", type: "(i) & 0xffffffff", note: "32-bit type field"}
      rel_versus_rela:
        rule: >-
          SHT_REL and SHT_RELA identify the on-disk record kind. In
          elf_link_read_relocs_from_section, the already-selected section's
          sh_entsize chooses swap_reloc_in or swap_reloca_in and must equal
          the backend's sizeof_rel or sizeof_rela (bfd/elflink.c:2128-2136).
        read_behaviour:
          - "REL: r_addend is set to 0 on read (bfd/elfcode.h:398-407)."
          - "RELA: r_addend is read as a signed value (bfd/elfcode.h:409-418)."
        contract: >-
          The ELF backend linker caches swapped records as Elf_Internal_Rela,
          with zero r_addend for REL (bfd/elf-bfd.h:1380-1383). This is distinct
          from the public, format-neutral arelent representation.
        per_section_flag: "use_rela_p on asection (bfd/bfd-in2.h:1393-1394)."
      implicit_addend:
        summary: >-
          REL has no separate r_addend field; an implicit addend is encoded
          in the relocated contents. Its decoding depends on the target's
          masks, shifts, sign rules and special callbacks, not just the
          generic width or partial_inplace flag (bfd/reloc.c:330-354).
        convention:
          partial_inplace_TRUE: "Partial linking can update the section contents in place."
          partial_inplace_FALSE: "Partial linking can update the relocation instead; not every REL relocation sets this flag TRUE."
          src_mask: "Normally equals dst_mask for an in-place REL addend and is zero for RELA; read target-specific exceptions."
        concrete_examples:
          - {file: "bfd/elf32-i386.c", lines: "3088-3155", note: "reads the addend out of the section data for STT_SECTION symbols against SEC_MERGE sections, sign-extending for PC-relative forms"}
          - {file: "bfd/elf32-arm.c", lines: "7913-7927", note: "explicit use_rel branch: masks the section data with src_mask and sign-extends"}
      qbfd_equivalent: >-
        qBFD exposes Relocation::hasAddend (qBFDCore.hpp:193). Its current
        ELF code sets it for RELA or after a bitSize-driven read of section
        bytes (qELF.hpp:480-491). The latter branch is not restricted to
        x86/x64. It is a contiguous integer read, not a general decoder for
        split instruction fields; a known type name alone does not prove
        that its implicit addend has been decoded correctly.

    naming_mechanism:
      summary: >-
        In this vintage the relocation name is `reloc_howto_type.name` from
        the per-target howto table. The reverse lookup, name to type, is a
        linear strcasecmp over that table.
      per_target_tables:
        - {arch: i386, table: elf_howto_table, source: "bfd/elf32-i386.c:56-185"}
        - {arch: x86-64, table: x86_64_elf_howto_table, source: "bfd/elf64-x86-64.c:56-247"}
        - {arch: arm, table: "elf32_arm_howto_table_1/2/3", source: "bfd/elf32-arm.c:73-1766"}
        - {arch: ppc, table: ppc_elf_howto_raw, source: "bfd/elf32-ppc.c:151-179"}
      reverse_lookup:
        - {name: elf_i386_reloc_name_lookup, source: "bfd/elf32-i386.c:346-358"}
        - {name: elf_x86_64_reloc_name_lookup, source: "bfd/elf64-x86-64.c:294-315"}
        - {name: bfd_reloc_name_lookup, source: "bfd/reloc.c:5995-5999"}
      type_to_howto:
        slots: [elf_info_to_howto, elf_info_to_howto_rel]
        source: "bfd/elf-bfd.h:723-729"
        dispatch: "bfd/elfcode.h:1446-1451"

