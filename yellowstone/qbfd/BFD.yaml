    section_flag_mapping:
      source: bfd/elf.c:847-877
      rules:
        - "SEC_HAS_CONTENTS unless sh_type == SHT_NOBITS"
        - "SEC_GROUP | SEC_EXCLUDE when sh_type == SHT_GROUP"
        - "SHF_ALLOC -> SEC_ALLOC, and SEC_LOAD as well unless SHT_NOBITS"
        - "no SHF_WRITE -> SEC_READONLY"
        - "SHF_EXECINSTR -> SEC_CODE; otherwise, if SEC_LOAD, SEC_DATA"
        - "SHF_MERGE -> SEC_MERGE and entsize = sh_entsize; SHF_STRINGS adds SEC_STRINGS"
        - "SHF_TLS -> SEC_THREAD_LOCAL"
        - "SHF_EXCLUDE -> SEC_EXCLUDE"
        - "SHF_GROUP triggers setup_group()"
      debug_sections:
        note: >-
          This path uses names to recognize debug data only when SEC_ALLOC
          is already clear. It sets SEC_DEBUGGING and does not itself clear
          an allocated section's SEC_ALLOC bit, despite the nearby comment.
        source: bfd/elf.c:879-924
        name_prefixes: [".debug", ".stab", ".line", ".gnu.linkonce.wi.", ".zdebug"]
      lesson: >-
        qBFD's `sec::Flags` (qBFDCore.hpp:105-121) is a coarser set. Its
        `Debug` bit corresponds to BFD's name-based debug detection; its
        `Note` bit has no direct BFD counterpart because BFD models notes
        as ordinary sections.

    groups:
      validity_macro: "IS_VALID_GROUP_SECTION_HEADER  (bfd/elf.c:548-552)"
      rules:
        - "sh_type == SHT_GROUP"
        - "sh_size >= 2 * GRP_ENTRY_SIZE"
        - "sh_entsize == GRP_ENTRY_SIZE (4)"
        - "sh_size % GRP_ENTRY_SIZE == 0"
        - "The first 4-byte word is the flags word; GRP_COMDAT (1) marks a COMDAT group (bfd/elf.c:1924-1926)."

    alignment:
      file_align:
        elf32: {FILE_ALIGN: 4, LOG_FILE_ALIGN: 2}
        elf64: {FILE_ALIGN: 8, LOG_FILE_ALIGN: 3}
        source: bfd/elfcode.h:130-145
      sh_addralign_to_bfd: "bfd_set_section_alignment(abfd, s, bfd_log2(sh_addralign))  (bfd/elf.c:843-844)"
      bfd_to_sh_addralign: "sh_addralign = 1 << alignment_power  (bfd/elf.c:2609)"
      bfd_log2: "Ceiling log2: 1025 -> 11, 0 -> 0  (bfd/libbfd.c:977-989)"
      file_position: "BFD_ALIGN(offset, sh_addralign), then offset += sh_size unless SHT_NOBITS  (bfd/elf.c:3392-3404)"
      bfd_align_macro: "Overflow-safe: bfd/libbfd.h:39-42"

    string_tables:
      rules:
        - "Index 0 must be a NUL byte and maps to the empty string."
        - "On write, the leading NUL is emitted first and the empty string is never refcounted (bfd/elf-strtab.c:142-181, 234-261)."
        - "On read, an out-of-range offset is an error, not a clamp (bfd/elf.c:311-343)."
        - "BFD allocates one extra byte and writes a terminating NUL past the end of the table, to survive an unterminated table (bfd/elf.c:305)."
      well_known_names: [".shstrtab", ".symtab", ".strtab"]
      source: bfd/elf.c:5146-5151

    checksum:
      function: elf_checksum_contents
      source: bfd/elfcode.h:1060-1105
      covers: "the ELF header with e_phoff and e_shoff zeroed, the program headers, and each section header with sh_offset zeroed followed by the section contents"

    section_numbering:
      rule: "SHT_GROUP sections are numbered first, then normal sections, then their .rel/.rela companions."
      source: bfd/elf.c:2914-3005

# ---------------------------------------------------------------------------
# 3. COFF
# ---------------------------------------------------------------------------
  coff:
    files: ["bfd/coffgen.c", "bfd/coffcode.h", "bfd/libcoff.h", "bfd/coffswap.h"]
    note: "coffcode.h is the template; the per-machine files include it with their own macros."

    detection:
      entry_point: coff_object_p
      source: bfd/coffgen.c:241-305
      steps:
        - "Read bfd_coff_filhsz bytes (the file header)."
        - "Swap it in with coff_swap_filehdr_in (bfd/coffswap.h:253-276)."
        - "Call the backend's bad_format_hook, which is where the magic is tested (bfd/coffcode.h:1614-1636)."
        - "Reject if f_opthdr > the target's aoutsz."
        - "Read and swap the optional header if f_opthdr != 0."
        - "Delegate to coff_real_object_p (bfd/coffgen.c:155-236)."
      magic_is_a_machine_number: >-
        COFF has no byte signature. The first field of the file header is a
        machine number, and the "is this my format" test is a switch over
        that number.
      magic_values:
        I386MAGIC: {value: 0x14c, source: "include/coff/i386.h:38", also_known_as: IMAGE_FILE_MACHINE_I386}
        I386PTXMAGIC: {value: 0x154, source: "include/coff/i386.h:39"}
        I386AIXMAGIC: {value: 0x175, source: "include/coff/i386.h:40"}
        LYNXCOFFMAGIC: {value: 0x10d, source: "include/coff/i386.h:44"}
        AMD64MAGIC: {value: 0x8664, source: "include/coff/x86_64.h:30", also_known_as: IMAGE_FILE_MACHINE_AMD64}
      badmag_macro:
        source: "include/coff/i386.h:46-49"
        text: >-
          #define I386BADMAG(x) ((x).f_magic != I386MAGIC && (x).f_magic != I386AIXMAGIC && (x).f_magic != I386PTXMAGIC && (x).f_magic != LYNXCOFFMAGIC)

    file_header:
      size: 20
      macro: FILHSZ
      source: include/coff/external.h:26-38
      fields:
        - {field: f_magic, type: u16, offset: 0, note: "machine number, not a signature"}
        - {field: f_nscns, type: u16, offset: 2}
        - {field: f_timdat, type: u32, offset: 4}
        - {field: f_symptr, type: u32, offset: 8}
        - {field: f_nsyms, type: u32, offset: 12}
        - {field: f_opthdr, type: u16, offset: 16}
        - {field: f_flags, type: u16, offset: 18}
      flags:
        source: include/coff/internal.h:100-110
        values:
          F_RELFLG: 0x0001
          F_EXEC: 0x0002
          F_LNNO: 0x0004
          F_LSYMS: 0x0008
          F_AR16WR: 0x0080
          F_AR32WR: 0x0100
          F_AR32W: 0x0200
          F_DYNLOAD: 0x1000
          F_SHROBJ: 0x2000
          F_DLL: 0x2000
          F_GO32STUB: 0x4000
        note: "F_SHROBJ and F_DLL are the same bit."

    symbol_table:
      entry_size: 18
      macro: SYMESZ
      source: include/coff/external.h:150-171
      fields:
        - {field: "e_name[8]", type: "char[8]", offset: 0, note: "inline name, or zeroes+offset"}
        - {field: e_value, type: u32, offset: 8}
        - {field: e_scnum, type: u16, offset: 12}
        - {field: e_type, type: u16, offset: 14}
        - {field: e_sclass, type: u8, offset: 16}
        - {field: e_numaux, type: u8, offset: 17}
      name_rule:
        source: bfd/coffswap.h:312-324
        text: >-
          If e_name[0] == 0 the name is long: zeroes = 0 and offset = the
          32-bit little-endian value at e_name[4]. Otherwise the 8 bytes are
          the name, copied verbatim.
      auxiliary_record:
        size: 18
        macro: AUXESZ
        source: include/coff/external.h:193-263
        variants:
          - {name: x_sym, layout: "x_tagndx:4, x_misc:4, x_fcnary:8, x_tvndx:2"}
          - {name: x_file, layout: "x_fname[14], or zeroes+offset"}
          - {name: x_scn, layout: "x_scnlen:4, x_nreloc:2, x_nlinno:2, [x_checksum:4, x_associated:2, x_comdat:1]"}
          - {name: x_tv, layout: "x_tvfill:4, x_tvlen:2, x_tvran[2][2]:4"}
        pe_extension: "The COMDAT fields are only read for i386 and x86_64 (INCLUDE_COMDAT_FIELDS_IN_AUXENT, include/coff/i386.h:21)."

    section_header:
      size: 40
      macro: SCNHSZ
      source: include/coff/external.h:78-93
      fields:
        - {field: s_name, type: "char[8]", offset: 0, note: "inline name, or /<decimal strtab offset>"}
        - {field: s_paddr, type: u32, offset: 8, note: "PhysicalAddress; in PE this is VirtualSize"}
        - {field: s_vaddr, type: u32, offset: 12, note: "VirtualAddress (an RVA in PE)"}
        - {field: s_size, type: u32, offset: 16, note: "SizeOfRawData"}
        - {field: s_scnptr, type: u32, offset: 20, note: "PointerToRawData"}
        - {field: s_relptr, type: u32, offset: 24}
        - {field: s_lnnoptr, type: u32, offset: 28}
        - {field: s_nreloc, type: u16, offset: 32}
        - {field: s_nlnno, type: u16, offset: 34}
        - {field: s_flags, type: u32, offset: 36, note: "Characteristics"}
      pe_overrides:
        source: bfd/peicode.h:195-247
        rules:
          - "s_nlnno is reconstructed as s_nlnno + (s_nreloc << 16) and s_nreloc is forced to 0 (the MS line-number overflow hack)."
          - "s_vaddr is made absolute by adding the image base."
          - "s_size is replaced by s_paddr (virtual size) for uninitialized data, or when the raw size exceeds the virtual size."

    relocation:
      size: 10
      macro: RELSZ
      source: include/coff/i386.h:65-73
      fields:
        - {field: r_vaddr, type: u32, offset: 0, note: "VirtualAddress"}
        - {field: r_symndx, type: u32, offset: 4, note: "SymbolTableIndex"}
        - {field: r_type, type: u16, offset: 8}
      per_machine_size: "RELSZ is 10 for i386/x86-64/arm/ia64, 12 for i960, 14 for m68k/mcore/apollo, 16 for alpha/h8300/h8500."

    long_names:
      convention:
        text: >-
          A section name longer than 8 bytes is stored in the string table;
          the s_name field holds '/' followed by the ASCII decimal offset of
          the name, relative to the start of the string table's size field.
        source: bfd/coffcode.h:111-171
      read_algorithm:
        source: bfd/coffgen.c:62-99
        steps:
          - "Only if the target supports long section names (COFF_LONG_SECTION_NAMES)."
          - "s_name[0] must be '/'."
          - "The 7 bytes after the slash are parsed with strtol; the whole field must be digits."
          - "The offset is added to the base of the string table."
          - "The base returned by _bfd_coff_read_string_table points at the 4-byte size field, so offset 4 is the first name byte."
        known_defect: "BFD does not bounds-check the offset: there is an explicit FIXME about running past the end (bfd/coffgen.c:89-91)."
      write_algorithm:
        source: bfd/coffcode.h:3687-3726
        rules:
          - "Names longer than 8 bytes go to the string table; s_name gets /<offset>."
          - "The first long name is written at offset 4, because string_size starts at STRING_SIZE_SIZE (4)."
          - "A string table larger than 10000000 bytes is an error: /nnnnnnn cannot address further."
      string_table_layout:
        source: bfd/coffgen.c:1536-1597
        rules:
          - "The string table immediately follows the symbol table."
          - "Layout: a 4-byte total size, then the NUL-terminated strings."
          - "The total size includes the 4 size bytes themselves."
          - "A size below 4 is an error."
          - "A truncated file forces the size to 4, i.e. no strings."
        order_when_writing: "All long section names first, then the long symbol names (bfd/coffgen.c:1226-1291)."
      symbol_long_names: "The same table serves symbol names; see coff_fix_symbol_name (bfd/coffgen.c:787-896)."

    section_flags:
      pe_characteristics:
        source: include/coff/pe.h:53-112
        values:
          IMAGE_SCN_TYPE_NO_PAD: 0x00000008
          IMAGE_SCN_CNT_CODE: 0x00000020
          IMAGE_SCN_CNT_INITIALIZED_DATA: 0x00000040
          IMAGE_SCN_CNT_UNINITIALIZED_DATA: 0x00000080
          IMAGE_SCN_LNK_OTHER: 0x00000100
          IMAGE_SCN_LNK_INFO: 0x00000200
          IMAGE_SCN_LNK_REMOVE: 0x00000800
          IMAGE_SCN_LNK_COMDAT: 0x00001000
          IMAGE_SCN_MEM_FARDATA: 0x00008000
          IMAGE_SCN_MEM_PURGEABLE: 0x00020000
          IMAGE_SCN_MEM_16BIT: 0x00020000
          IMAGE_SCN_MEM_LOCKED: 0x00040000
          IMAGE_SCN_MEM_PRELOAD: 0x00080000
          IMAGE_SCN_ALIGN_POWER_BIT_POS: 20
          IMAGE_SCN_ALIGN_POWER_BIT_MASK: 0x00f00000
          IMAGE_SCN_LNK_NRELOC_OVFL: 0x01000000
          IMAGE_SCN_MEM_DISCARDABLE: 0x02000000
          IMAGE_SCN_MEM_NOT_CACHED: 0x04000000
          IMAGE_SCN_MEM_NOT_PAGED: 0x08000000
          IMAGE_SCN_MEM_SHARED: 0x10000000
          IMAGE_SCN_MEM_EXECUTE: 0x20000000
          IMAGE_SCN_MEM_READ: 0x40000000
          IMAGE_SCN_MEM_WRITE: 0x80000000
        notes:
          - "IMAGE_SCN_GPREL does not exist under that name here; bit 0x8000 is IMAGE_SCN_MEM_FARDATA. The numeric value is the same as modern IMAGE_SCN_GPREL."
          - "COMDAT selection is not a section flag; it is carried in the auxiliary record (x_comdat, x_associated, x_checksum)."
        comdat_selection:
          source: include/coff/pe.h:114-120
          values:
            IMAGE_COMDAT_SELECT_NODUPLICATES: 1
            IMAGE_COMDAT_SELECT_ANY: 2
            IMAGE_COMDAT_SELECT_SAME_SIZE: 3
            IMAGE_COMDAT_SELECT_EXACT_MATCH: 4
            IMAGE_COMDAT_SELECT_ASSOCIATIVE: 5
        alignment_encoding:
          source: include/coff/pe.h:82-103
          formula: "IMAGE_SCN_ALIGN_POWER_CONST(val) = ((val)+1) << 20; IMAGE_SCN_ALIGN_POWER_NUM(val) = ((val) >> 20) - 1"
      classic_styp:
        source: include/coff/internal.h:385-408
        values:
          STYP_REG: 0x0000
          STYP_DSECT: 0x0001
          STYP_NOLOAD: 0x0002
          STYP_GROUP: 0x0004
          STYP_PAD: 0x0008
          STYP_COPY: 0x0010
          STYP_TEXT: 0x0020
          STYP_DATA: 0x0040
          STYP_BSS: 0x0080
          S_NEWFCN: 0x0100
          STYP_INFO: 0x0200
          STYP_OVER: 0x0400
          STYP_LIB: 0x0800
          STYP_MERGE: 0x2000
          STYP_REVERSE_PAD: 0x4000
          STYP_LIT: 0x8020
      bfd_mapping:
        pe_direction:
          function: styp_to_sec_flags
          source: bfd/coffcode.h:1141-1303
          rules:
            - "default: SEC_READONLY"
            - "MEM_READ absent -> SEC_COFF_NOREAD"
            - "MEM_EXECUTE -> SEC_CODE"
            - "MEM_WRITE -> clear SEC_READONLY"
            - "CNT_CODE -> SEC_CODE | SEC_ALLOC | SEC_LOAD"
            - "CNT_INITIALIZED_DATA -> SEC_DATA | SEC_ALLOC | SEC_LOAD, or SEC_DEBUGGING for a debug section"
            - "CNT_UNINITIALIZED_DATA -> SEC_ALLOC"
            - "MEM_DISCARDABLE -> SEC_DEBUGGING | SEC_READONLY, but only for a recognised debug section"
            - "MEM_SHARED -> SEC_COFF_SHARED"
            - "LNK_REMOVE -> SEC_EXCLUDE, unless the section is debug"
            - "LNK_COMDAT -> handle_COMDAT()"
            - "LNK_OTHER, MEM_NOT_CACHED, MEM_NOT_PAGED -> unhandled; BFD emits an 'ignored' warning"
        reverse_direction:
          function: sec_to_styp_flags
          source: bfd/coffcode.h:648-714
        overlap_warning: "The source comments note that STYP_* and IMAGE_SCN_* overlap but IMAGE_SCN_* is the larger set (bfd/coffcode.h:662-668)."

    comdat:
      function: handle_COMDAT
      source: bfd/coffcode.h:872-1129
      rules:
        - "The COMDAT name comes from the second qualifying symbol in the section, in MSVC mode."
        - "In gas mode, the name is the text after '$' in the section name."
        - "The selection byte maps to SEC_LINK_DUPLICATES_* flags (bfd/coffcode.h:1026-1070)."

    symbols:
      storage_classes:
        source: include/coff/internal.h:256-355
        values:
          C_EFCN: 255
          C_NULL: 0
          C_AUTO: 1
          C_EXT: 2
          C_STAT: 3
          C_REG: 4
          C_EXTDEF: 5
          C_LABEL: 6
          C_ULABEL: 7
          C_MOS: 8
          C_ARG: 9
          C_STRTAG: 10
          C_MOU: 11
          C_UNTAG: 12
          C_TPDEF: 13
          C_USTATIC: 14
          C_ENTAG: 15
          C_MOE: 16
          C_REGPARM: 17
          C_FIELD: 18
          C_AUTOARG: 19
          C_LASTENT: 20
          C_BLOCK: 100
          C_FCN: 101
          C_EOS: 102
          C_FILE: 103
          C_LINE: 104
          C_ALIAS: 105
          C_HIDDEN: 106
          C_WEAKEXT: 127
        pe_overrides:
          C_SECTION: {value: 104, note: "overlaps C_LINE"}
          C_NT_WEAK: {value: 105, note: "overlaps C_ALIAS"}
      base_types:
        source: include/coff/internal.h:469-485
        values:
          T_NULL: 0
          T_VOID: 1
          T_CHAR: 2
          T_SHORT: 3
          T_INT: 4
          T_LONG: 5
          T_FLOAT: 6
          T_DOUBLE: 7
          T_STRUCT: 8
          T_UNION: 9
          T_ENUM: 10
          T_MOE: 11
          T_UCHAR: 12
          T_USHORT: 13
          T_UINT: 14
          T_ULONG: 15
          T_LNGDBL: 16
      derived_types:
        source: include/coff/internal.h:487-506
        values: {DT_NON: 0, DT_PTR: 1, DT_FCN: 2, DT_ARY: 3}
        bit_layout: "N_BTMASK 0xf, N_TMASK 0x30, N_BTSHFT 4, N_TSHIFT 2"
        accessors: "BTYPE, DTYPE, ISPTR, ISFCN, ISARY, ISTAG, DECREF"
      classification:
        function: coff_classify_symbol
        source: bfd/coffcode.h:5003-5092
        outcomes: {COFF_SYMBOL_GLOBAL: global, COFF_SYMBOL_COMMON: common, COFF_SYMBOL_UNDEFINED: undefined, COFF_SYMBOL_LOCAL: local, COFF_SYMBOL_PE_SECTION: pe section symbol}
        rules:
          - "C_EXT / C_WEAKEXT / C_NT_WEAK with n_scnum == 0 and n_value == 0 -> UNDEFINED"
          - "same with n_value != 0 -> COMMON"
          - "same with n_scnum != 0 -> GLOBAL"
          - "C_STAT with n_scnum == 0 -> LOCAL"
          - "C_SECTION -> PE_SECTION"
          - "anything else -> LOCAL, with a warning if n_scnum == 0"
      bfd_flags:
        function: coff_slurp_symbol_table
        source: bfd/coffcode.h:4637-4997
        rules:
          - "C_EXT and friends -> BSF_EXPORT | BSF_GLOBAL, plus BSF_NOT_AT_END | BSF_FUNCTION when ISFCN(n_type)"
          - "C_NT_WEAK and C_WEAKEXT additionally get BSF_WEAK"
          - "C_STAT and friends -> BSF_LOCAL, or BSF_DEBUGGING when n_scnum == N_DEBUG"
          - "C_FILE, C_STRTAG -> BSF_DEBUGGING"
          - "C_MOS, C_EOS, C_REGPARM, C_ARG, C_TPDEF and the tag classes -> BSF_DEBUGGING"
          - "C_BLOCK, C_FCN, C_EFCN -> BSF_DEBUGGING in PE, BSF_LOCAL in plain COFF"
          - "Unrecognised storage class -> an error message and BSF_DEBUGGING"
      value_semantics:
        pe: "symbol.value = n_value (already section-relative)"
        non_pe: "symbol.value = n_value - section->vma"
        source: bfd/coffcode.h:4716-4722

    relocations:
      x86_64:
        source: include/coff/internal.h:664-679
        values:
          R_AMD64_ABS: 0
          R_AMD64_DIR64: 1
          R_AMD64_DIR32: 2
          R_AMD64_IMAGEBASE: 3
          R_AMD64_PCRLONG: 4
          R_AMD64_PCRLONG_1: 5
          R_AMD64_PCRLONG_2: 6
          R_AMD64_PCRLONG_3: 7
          R_AMD64_PCRLONG_4: 8
          R_AMD64_PCRLONG_5: 9
          R_AMD64_SECTION: 10
          R_AMD64_SECREL: 11
          R_AMD64_SECREL7: 12
          R_AMD64_TOKEN: 13
          R_AMD64_PCRQUAD: 14
        howto_names:
          source: bfd/coff-x86_64.c:205-450
          values:
            1: R_X86_64_64
            2: R_X86_64_32
            3: rva32
            4: R_X86_64_PC32
            5: DISP32+1
            6: DISP32+2
            7: DISP32+3
            8: DISP32+4
            9: DISP32+5
            11: secrel32
            14: R_X86_64_PC64
            15: R_X86_64_8
            16: R_X86_64_16
            17: R_X86_64_32S
            18: R_X86_64_PC8
            19: R_X86_64_PC16
            20: R_X86_64_PC32
      i386:
        source: include/coff/internal.h:683-709
        values:
          R_DIR16: 1
          R_REL24: 5
          R_DIR32: 6
          R_IMAGEBASE: 7
          R_SECREL32: 11
          R_RELBYTE: 15
          R_RELWORD: 16
          R_RELLONG: 17
          R_PCRBYTE: 18
          R_PCRWORD: 19
          R_PCRLONG: 20
          R_PCR24: 21
          R_IPRSHORT: 24
          R_IPRLONG: 26
          R_GETSEG: 29
          R_GETPA: 30
          R_TAGWORD: 31
          R_PARTLS16: 32
          R_PARTMS8: 33
          R_PCR16L: 128
          R_PCR26L: 129
          R_VRT16: 130
          R_HVRT16: 131
          R_LVRT16: 132
          R_VRT32: 133
        howto_names:
          source: bfd/coff-i386.c:207-350
          values: {6: dir32, 7: rva32, 11: secrel32, 15: "8", 16: "16", 17: "32", 18: DISP8, 19: DISP16, 20: DISP32}
        discrepancy: >-
          GNU's COFF i386 numbering is its own scheme and does NOT match
          Microsoft's IMAGE_REL_I386_* values. For example GNU R_SECREL32 is
          11 where MS IMAGE_REL_I386_SECREL is 9.
      instruction_field_relocations:
        rule: >-
          R_AMD64_PCRLONG_1 .. R_AMD64_PCRLONG_5 are folded into
          R_AMD64_PCRLONG with an addend correction of -N, because the 32-bit
          displacement field sits N bytes past the end of the instruction.
        source: bfd/coff-x86_64.c:557-565
      reloc_count_overflow:
        mechanism: IMAGE_SCN_LNK_NRELOC_OVFL
        read:
          source: bfd/coffcode.h:1887-1909
          rule: >-
            The FIRST relocation record's VirtualAddress field holds the real
            count minus 1. That record is consumed and skipped, and
            s_nreloc is set from it.
        write:
          source: bfd/coffcode.h:2658-2672
          rule: "A synthetic first reloc with r_vaddr = reloc_count + 1 is written, and s_nreloc is set to 0xffff."
        lesson: >-
          qBFD must handle this when reading a PE object with more than
          0xffff relocations in one section, or it will misparse the
          relocation table.

# ---------------------------------------------------------------------------
# 4. PE
# ---------------------------------------------------------------------------
  pe:
    files: ["bfd/peXXigen.c", "bfd/peicode.h", "include/coff/pe.h"]
    note: "PE is COFF plus a DOS stub, an optional header, data directories and richer section flags."

    detection:
      entry_point: pe_bfd_object_p
      source: bfd/peicode.h:1244-1316
      steps:
        - "Read 4 bytes; if they are 0xffff0000 the file is a Microsoft Import Library and is handled by pe_ILF_object_p (bfd/peicode.h:1070-1242)."
        - "Read the 128-byte DOS header; e_magic must be DOSMAGIC (0x5a4d)."
        - "Seek to e_lfanew; read the 24-byte PE header; nt_signature must be 0x00004550."
        - "Seek to e_lfanew - sizeof(dos_hdr) so that the COFF file-header read lands correctly."
        - "Delegate to coff_object_p."
      import_library:
        note: "The ILF reader decodes the PE machine type and maps it to the matching COFF magic."
        source: bfd/peicode.h:1100-1173
        machines:
          IMAGE_FILE_MACHINE_UNKNOWN: 0
          IMAGE_FILE_MACHINE_I386: 0x14c
          IMAGE_FILE_MACHINE_AMD64: 0x8664
          IMAGE_FILE_MACHINE_ARM: 0x1c0
          IMAGE_FILE_MACHINE_THUMB: 0x1c2
          IMAGE_FILE_MACHINE_POWERPC: 0x1f0
          IMAGE_FILE_MACHINE_MIPS16: 0x266
          IMAGE_FILE_MACHINE_MIPSFPU: 0x366
          IMAGE_FILE_MACHINE_MIPSFPU16: 0x466
          IMAGE_FILE_MACHINE_R3000: 0x162
          IMAGE_FILE_MACHINE_R4000: 0x166
          IMAGE_FILE_MACHINE_R10000: 0x168
          IMAGE_FILE_MACHINE_SH3: 0x1a2
          IMAGE_FILE_MACHINE_SH4: 0x1a6
          IMAGE_FILE_MACHINE_ALPHA: 0x184
          IMAGE_FILE_MACHINE_ALPHA64: 0x284
          IMAGE_FILE_MACHINE_IA64: 0x200
          IMAGE_FILE_MACHINE_M68K: 0x268
        rejection: "PowerPC is explicitly rejected: 'We no longer support PowerPC' (bfd/peicode.h:1162-1163)."

    dos_header:
      size: 128
      source: include/coff/pe.h:177-200
      fields:
        - {field: e_magic, offset: 0, size: 2, value: 0x5a4d}
        - {field: e_cblp, offset: 2, size: 2}
        - {field: e_cp, offset: 4, size: 2}
        - {field: e_crlc, offset: 6, size: 2}
        - {field: e_cparhdr, offset: 8, size: 2}
        - {field: e_minalloc, offset: 10, size: 2}
        - {field: e_maxalloc, offset: 12, size: 2}
        - {field: e_ss, offset: 14, size: 2}
        - {field: e_sp, offset: 16, size: 2}
        - {field: e_csum, offset: 18, size: 2}
        - {field: e_ip, offset: 20, size: 2}
        - {field: e_cs, offset: 22, size: 2}
        - {field: e_lfarlc, offset: 24, size: 2}
        - {field: e_ovno, offset: 26, size: 2}
        - {field: "e_res[4][2]", offset: 28, size: 8}
        - {field: e_oemid, offset: 36, size: 2}
        - {field: e_oeminfo, offset: 38, size: 2}
        - {field: "e_res2[10][2]", offset: 40, size: 20}
        - {field: e_lfanew, offset: 60, size: 4, note: "file offset of the PE header"}
        - {field: "dos_message[16][4]", offset: 64, size: 64}
      writer_defaults:
        source: bfd/peXXigen.c:736-843
        values: {e_magic: 0x5a4d, e_cblp: 0x90, e_cp: 0x3, e_cparhdr: 0x4, e_maxalloc: 0xffff, e_sp: 0xb8, e_lfarlc: 0x40, e_lfanew: 0x80}

    pe_header:
      signature: {value: 0x00004550, spelling: "PE\\0\\0", source: "include/coff/pe.h:170"}
      file_header:
        size: 24
        source: include/coff/pe.h:202-214
        fields:
          - {field: nt_signature, offset: 0, size: 4}
          - {field: f_magic, offset: 4, size: 2, note: "Machine; not a signature"}
          - {field: f_nscns, offset: 6, size: 2}
          - {field: f_timdat, offset: 8, size: 4}
          - {field: f_symptr, offset: 12, size: 4}
          - {field: f_nsyms, offset: 16, size: 4}
          - {field: f_opthdr, offset: 20, size: 2}
          - {field: f_flags, offset: 22, size: 2}
      combined_pe_file_header:
        size: 152
        macro: FILHSZ
        source: include/coff/pe.h:216-262
        note: "The 128-byte DOS header followed by the 24-byte PE header. COFF's 20-byte file-header read is applied at e_lfanew - 128."

    optional_header:
      pe32:
        macro: AOUTSZ
        size: 224
        source: include/coff/pe.h:268-299
        fields:
          - {field: Magic, offset: 0, size: 2, value: 0x10b}
          - {field: MajorLinkerVersion, offset: 2, size: 1}
          - {field: MinorLinkerVersion, offset: 3, size: 1}
          - {field: SizeOfCode, offset: 4, size: 4}
          - {field: SizeOfInitializedData, offset: 8, size: 4}
          - {field: SizeOfUninitializedData, offset: 12, size: 4}
          - {field: AddressOfEntryPoint, offset: 16, size: 4}
          - {field: BaseOfCode, offset: 20, size: 4}
          - {field: BaseOfData, offset: 24, size: 4, note: "PE32 only"}
          - {field: ImageBase, offset: 28, size: 4}
          - {field: SectionAlignment, offset: 32, size: 4}
          - {field: FileAlignment, offset: 36, size: 4}
          - {field: MajorOperatingSystemVersion, offset: 40, size: 2}
          - {field: MinorOperatingSystemVersion, offset: 42, size: 2}
          - {field: MajorImageVersion, offset: 44, size: 2}
          - {field: MinorImageVersion, offset: 46, size: 2}
          - {field: MajorSubsystemVersion, offset: 48, size: 2}
          - {field: MinorSubsystemVersion, offset: 50, size: 2}
          - {field: Reserved1, offset: 52, size: 4}
          - {field: SizeOfImage, offset: 56, size: 4}
          - {field: SizeOfHeaders, offset: 60, size: 4}
          - {field: CheckSum, offset: 64, size: 4}
          - {field: Subsystem, offset: 68, size: 2}
          - {field: DllCharacteristics, offset: 70, size: 2}
          - {field: SizeOfStackReserve, offset: 72, size: 4}
          - {field: SizeOfStackCommit, offset: 76, size: 4}
          - {field: SizeOfHeapReserve, offset: 80, size: 4}
          - {field: SizeOfHeapCommit, offset: 84, size: 4}
          - {field: LoaderFlags, offset: 88, size: 4}
          - {field: NumberOfRvaAndSizes, offset: 92, size: 4}
          - {field: "DataDirectory[16]", offset: 96, size: 128}
      pe32plus:
        macro: PEPAOUTSZ
        size: 240
        source: include/coff/pe.h:304-341
        magic: 0x20b
        differences:
          - "No BaseOfData."
          - "ImageBase is 8 bytes."
          - "SizeOfStackReserve, SizeOfStackCommit, SizeOfHeapReserve and SizeOfHeapCommit are 8 bytes each."
          - "Everything after BaseOfCode shifts by 4 bytes."
        accessors: "libpei.h:209-302 selects the 32- or 64-bit accessors per target."

    data_directories:
      count: 16
      macro: IMAGE_NUMBEROF_DIRECTORY_ENTRIES
      entry_size: 8
      entry_layout: "VirtualAddress:4, Size:4"
      source: include/coff/internal.h:113-134
      indices:
        0: {macro: PE_EXPORT_TABLE, name: Export}
        1: {macro: PE_IMPORT_TABLE, name: Import}
        2: {macro: PE_RESOURCE_TABLE, name: Resource}
        3: {macro: PE_EXCEPTION_TABLE, name: "Exception (.pdata)"}
        4: {macro: PE_CERTIFICATE_TABLE, name: "Security/Certificate"}
        5: {macro: PE_BASE_RELOCATION_TABLE, name: "Base Relocation"}
        6: {macro: PE_DEBUG_DATA, name: Debug}
        7: {macro: PE_ARCHITECTURE, name: Architecture}
        8: {macro: PE_GLOBAL_PTR, name: "Global Ptr"}
        9: {macro: PE_TLS_TABLE, name: TLS}
        10: {macro: PE_LOAD_CONFIG_TABLE, name: "Load Config"}
        11: {macro: PE_BOUND_IMPORT_TABLE, name: "Bound Import"}
        12: {macro: PE_IMPORT_ADDRESS_TABLE, name: IAT}
        13: {macro: PE_DELAY_IMPORT_DESCRIPTOR, name: "Delay Import"}
        14: {macro: PE_CLR_RUNTIME_HEADER, name: "CLR Runtime Header"}
        15: {name: Reserved}
    defaults:
      source: include/coff/internal.h:137-149
      values:
        NT_EXE_IMAGE_BASE: 0x400000
        NT_DLL_IMAGE_BASE: 0x10000000
        BEOS_EXE_IMAGE_BASE: 0x80000000
        BEOS_DLL_IMAGE_BASE: 0x10000000
        PE_DEF_SECTION_ALIGNMENT: 0x1000
        PE_DEF_FILE_ALIGNMENT: 0x200

    import_directory:
      entry_size: 20
      source: bfd/peXXigen.c:1055-1357
      fields:
        - {field: OriginalFirstThunk, offset: 0, size: 4, note: "Import Lookup Table RVA"}
        - {field: TimeDateStamp, offset: 4, size: 4}
        - {field: ForwarderChain, offset: 8, size: 4}
        - {field: Name, offset: 12, size: 4, note: "RVA of the DLL name"}
        - {field: FirstThunk, offset: 16, size: 4, note: "IAT RVA"}
      termination: "An all-zero descriptor ends the list (bfd/peXXigen.c:1211-1212)."
      lookup_table:
        pe32: "4 bytes per entry (bfd/peXXigen.c:1313-1345)"
        pe32plus: "8 bytes per entry (bfd/peXXigen.c:1281-1311)"
        by_ordinal: "Bit 31 of the entry set means import by ordinal; otherwise the RVA points to a 2-byte hint followed by the NUL-terminated name."

    export_directory:
      entry_size: 40
      source: bfd/peXXigen.c:1359-1576
      fields:
        - {field: ExportFlags, offset: 0, size: 4}
        - {field: TimeDateStamp, offset: 4, size: 4}
        - {field: MajorVersion, offset: 8, size: 2}
        - {field: MinorVersion, offset: 10, size: 2}
        - {field: Name, offset: 12, size: 4, note: "RVA of the DLL name"}
        - {field: Base, offset: 16, size: 4, note: "ordinal base"}
        - {field: NumberOfFunctions, offset: 20, size: 4}
        - {field: NumberOfNames, offset: 24, size: 4}
        - {field: AddressOfFunctions, offset: 28, size: 4, note: "Export Address Table RVA"}
        - {field: AddressOfNames, offset: 32, size: 4, note: "Name Pointer Table RVA"}
        - {field: AddressOfNameOrdinals, offset: 36, size: 4, note: "Ordinal Table RVA"}
      table_entry_sizes: {EAT: 4, NPT: 4, OT: 2}

    base_relocations:
      note: "The .reloc section holds a sequence of blocks: a page RVA, a block size, then (block_size-8)/2 WORD entries."
      entry: "WORD: type in the high 4 bits, offset in the low 12 bits."

    comdat_and_weak_externals:
      weak_external: "A weak external is a C_NT_WEAK symbol with one auxiliary record naming the fallback symbol (bfd/cofflink.c:2997-3031)."

    pe_extras:
      pdata: "pe_print_pdata (bfd/peXXigen.c:1591) and pex64_bfd_print_pdata (bfd/pei-x86_64.c:422) print the exception directory."
      nearest_line: "coff_find_nearest_line (bfd/coffgen.c:2088) is the generic entry point; there is no pe_XXi386_find_nearest_line in this tree."

# ---------------------------------------------------------------------------
# 5. Mach-O
# ---------------------------------------------------------------------------
  macho:
    files: ["bfd/mach-o.c", "include/mach-o/loader.h", "include/mach-o/external.h", "include/mach-o/reloc.h"]
    note: >-
      None of the on-disk Mach-O constants live in bfd/mach-o.h; they are in
      include/mach-o/. bfd/mach-o.h holds only BFD-internal structures.
    constant_naming:
      note: >-
        In this BFD vintage every Mach-O constant carries a BFD_MACH_O_
        prefix in the source (BFD_MACH_O_LC_SEGMENT, BFD_MACH_O_S_REGULAR,
        BFD_MACH_O_N_STAB, BFD_MACH_O_GENERIC_RELOC_VANILLA,
        BFD_MACH_O_X86_64_RELOC_UNSIGNED). The unprefixed spellings used
        below are the canonical Apple names, which is what a reimplementation
        should use. The numeric values are identical.
      prefix: BFD_MACH_O_
      examples:
        - {canonical: LC_SEGMENT, bfd: BFD_MACH_O_LC_SEGMENT}
        - {canonical: S_REGULAR, bfd: BFD_MACH_O_S_REGULAR}
        - {canonical: N_STAB, bfd: BFD_MACH_O_N_STAB}
        - {canonical: GENERIC_RELOC_VANILLA, bfd: BFD_MACH_O_GENERIC_RELOC_VANILLA}
        - {canonical: X86_64_RELOC_UNSIGNED, bfd: BFD_MACH_O_X86_64_RELOC_UNSIGNED}

    detection:
      source: bfd/mach-o.c:1513-1545
      magics:
        MH_MAGIC: {value: 0xfeedface, class: 32, source: "include/mach-o/loader.h:28"}
        MH_CIGAM: {value: 0xcefaedfe, class: 32, source: "include/mach-o/loader.h:30", note: "defined but never referenced"}
        MH_MAGIC_64: {value: 0xfeedfacf, class: 64, source: "include/mach-o/loader.h:29"}
        MH_CIGAM_64: {value: 0xcffaedfe, class: 64, source: "include/mach-o/loader.h:32", note: "defined but never referenced"}
      method: >-
        Detection tries both byte orders of the SAME constant, rather than
        comparing against the CIGAM variants.
      note: "MH_CIGAM and MH_CIGAM_64 are defined but unused; the endian trial covers them."

    header:
      sizes: {32: 28, 64: 32}
      source: include/mach-o/external.h:25-38
      fields:
        - {field: magic, offset: 0, size: 4}
        - {field: cputype, offset: 4, size: 4}
        - {field: cpusubtype, offset: 8, size: 4}
        - {field: filetype, offset: 12, size: 4}
        - {field: ncmds, offset: 16, size: 4}
        - {field: sizeofcmds, offset: 20, size: 4}
        - {field: flags, offset: 24, size: 4}
        - {field: reserved, offset: 28, size: 4, note: "64-bit only"}
      all_fields_are_32_bit: true

    load_commands:
      req_dyld: {value: 0x80000000, source: "include/mach-o/loader.h:110"}
      source: include/mach-o/loader.h:112-158
      values:
        LC_SEGMENT: 0x1
        LC_SYMTAB: 0x2
        LC_SYMSEG: 0x3
        LC_THREAD: 0x4
        LC_UNIXTHREAD: 0x5
        LC_LOADFVMLIB: 0x6
        LC_IDFVMLIB: 0x7
        LC_IDENT: 0x8
        LC_FVMFILE: 0x9
        LC_PREPAGE: 0xa
        LC_DYSYMTAB: 0xb
        LC_LOAD_DYLIB: 0xc
        LC_ID_DYLIB: 0xd
        LC_LOAD_DYLINKER: 0xe
        LC_ID_DYLINKER: 0xf
        LC_PREBOUND_DYLIB: 0x10
        LC_ROUTINES: 0x11
        LC_SUB_FRAMEWORK: 0x12
        LC_SUB_UMBRELLA: 0x13
        LC_SUB_CLIENT: 0x14
        LC_SUB_LIBRARY: 0x15
        LC_TWOLEVEL_HINTS: 0x16
        LC_PREBIND_CKSUM: 0x17
        LC_LOAD_WEAK_DYLIB: 0x18
        LC_SEGMENT_64: 0x19
        LC_ROUTINES_64: 0x1a
        LC_UUID: 0x1b
        LC_RPATH: 0x1c
        LC_CODE_SIGNATURE: 0x1d
        LC_SEGMENT_SPLIT_INFO: 0x1e
        LC_REEXPORT_DYLIB: 0x1f
        LC_LAZY_LOAD_DYLIB: 0x20
        LC_ENCRYPTION_INFO: 0x21
        LC_DYLD_INFO: 0x22
        LC_LOAD_UPWARD_DYLIB: 0x23
        LC_VERSION_MIN_MACOSX: 0x24
        LC_VERSION_MIN_IPHONEOS: 0x25
        LC_FUNCTION_STARTS: 0x26
        LC_DYLD_ENVIRONMENT: 0x27
      req_dyld_handling:
        source: bfd/mach-o.c:2649-2652
        rule: >-
          The high bit is masked off to obtain the command type, and recorded
          separately as type_required. BFD records the bit but does not
          enforce the "required" semantics.
      unknown_commands:
        source: bfd/mach-o.c:2733-2736
        rule: >-
          An unknown command type produces an "unable to read unknown load
          command" message and the scan CONTINUES. The command is skipped,
          not fatal.
        lesson: >-
          This is the behaviour qBFD documents: "Unknown load commands are
          skipped after checking their envelope."
      absent_commands:
        note: "These do not exist in this tree at all."
        commands: [LC_MAIN, LC_DATA_IN_CODE, LC_SOURCE_VERSION, LC_DYLIB_CODE_SIGN_DRS, LC_ENCRYPTION_INFO_64, LC_LINKER_OPTION, LC_LINKER_OPTIMIZATION_HINT, LC_DYLD_EXPORTS_TRIE, LC_DYLD_CHAINED_FIXUPS, LC_FILESET_ENTRY]

    segments:
      segment_command_32:
        size: 56
        source: include/mach-o/external.h:84-96
        fields:
          - {field: cmd, offset: 0, size: 4}
          - {field: cmdsize, offset: 4, size: 4}
          - {field: "segname[16]", offset: 8, size: 16}
          - {field: vmaddr, offset: 24, size: 4}
          - {field: vmsize, offset: 28, size: 4}
          - {field: fileoff, offset: 32, size: 4}
          - {field: filesize, offset: 36, size: 4}
          - {field: maxprot, offset: 40, size: 4}
          - {field: initprot, offset: 44, size: 4}
          - {field: nsects, offset: 48, size: 4}
          - {field: flags, offset: 52, size: 4}
      segment_command_64:
        size: 72
        source: include/mach-o/external.h:98-110
        fields:
          - {field: cmd, offset: 0, size: 4}
          - {field: cmdsize, offset: 4, size: 4}
          - {field: "segname[16]", offset: 8, size: 16}
          - {field: vmaddr, offset: 24, size: 8}
          - {field: vmsize, offset: 32, size: 8}
          - {field: fileoff, offset: 40, size: 8}
          - {field: filesize, offset: 48, size: 8}
          - {field: maxprot, offset: 56, size: 4}
          - {field: initprot, offset: 60, size: 4}
          - {field: nsects, offset: 64, size: 4}
          - {field: flags, offset: 68, size: 4}
      vm_protection:
        source: bfd/mach-o.h:89-92
        values: {PROT_READ: 0x01, PROT_WRITE: 0x02, PROT_EXECUTE: 0x04}
      segment_flags:
        note: "SG_HIGHVM, SG_FVMLIB, SG_NORELOC, SG_PROTECTED_VERSION_1 and SG_READ_ONLY do not exist in this tree. The flags field is read raw and BFD always writes 0."

    sections:
      section_32:
        size: 68
        source: include/mach-o/external.h:42-56
        fields:
          - {field: "sectname[16]", offset: 0, size: 16}
          - {field: "segname[16]", offset: 16, size: 16}
          - {field: addr, offset: 32, size: 4}
          - {field: size, offset: 36, size: 4}
          - {field: offset, offset: 40, size: 4}
          - {field: align, offset: 44, size: 4, note: "log2"}
          - {field: reloff, offset: 48, size: 4}
          - {field: nreloc, offset: 52, size: 4}
          - {field: flags, offset: 56, size: 4}
          - {field: reserved1, offset: 60, size: 4}
          - {field: reserved2, offset: 64, size: 4}
      section_64:
        size: 80
        source: include/mach-o/external.h:60-75
        fields:
          - {field: "sectname[16]", offset: 0, size: 16}
          - {field: "segname[16]", offset: 16, size: 16}
          - {field: addr, offset: 32, size: 8}
          - {field: size, offset: 40, size: 8}
          - {field: offset, offset: 48, size: 4}
          - {field: align, offset: 52, size: 4}
          - {field: reloff, offset: 56, size: 4}
          - {field: nreloc, offset: 60, size: 4}
          - {field: flags, offset: 64, size: 4}
          - {field: reserved1, offset: 68, size: 4, note: "index into the indirect symbol table"}
          - {field: reserved2, offset: 72, size: 4, note: "stub size for S_SYMBOL_STUBS"}
          - {field: reserved3, offset: 76, size: 4}
      section_types:
        source: include/mach-o/loader.h:163-230
        mask: "S_SECTION_TYPE_MASK 0x000000ff (include/mach-o/loader.h:237)"
        values:
          S_REGULAR: 0x0
          S_ZEROFILL: 0x1
          S_CSTRING_LITERALS: 0x2
          S_4BYTE_LITERALS: 0x3
          S_8BYTE_LITERALS: 0x4
          S_LITERAL_POINTERS: 0x5
          S_NON_LAZY_SYMBOL_POINTERS: 0x6
          S_LAZY_SYMBOL_POINTERS: 0x7
          S_SYMBOL_STUBS: 0x8
          S_MOD_INIT_FUNC_POINTERS: 0x9
          S_MOD_FINI_FUNC_POINTERS: 0xa
          S_COALESCED: 0xb
          S_GB_ZEROFILL: 0xc
          S_INTERPOSING: 0xd
          S_16BYTE_LITERALS: 0xe
          S_DTRACE_DOF: 0xf
          S_LAZY_DYLIB_SYMBOL_POINTERS: 0x10
        absent: "S_THREAD_LOCAL_* (0x11-0x15) and S_ATTRIBUTES (0xff) do not exist in this tree."
      section_attributes:
        source: include/mach-o/loader.h:237-280
        mask: "S_SECTION_ATTRIBUTES_MASK 0xffffff00"
        values:
          S_ATTR_LOC_RELOC: 0x00000100
          S_ATTR_EXT_RELOC: 0x00000200
          S_ATTR_SOME_INSTRUCTIONS: 0x00000400
          S_ATTR_DEBUG: 0x02000000
          S_SELF_MODIFYING_CODE: 0x04000000
          S_ATTR_LIVE_SUPPORT: 0x08000000
          S_ATTR_NO_DEAD_STRIP: 0x10000000
          S_ATTR_STRIP_STATIC_SYMS: 0x20000000
          S_ATTR_NO_TOC: 0x40000000
          S_ATTR_PURE_INSTRUCTIONS: 0x80000000

    symbols:
      nlist:
        size32: 12
        size64: 16
        source: include/mach-o/external.h:127-145
        fields:
          - {field: n_strx, offset: 0, size: 4}
          - {field: n_type, offset: 4, size: 1}
          - {field: n_sect, offset: 5, size: 1}
          - {field: n_desc, offset: 6, size: 2}
          - {field: n_value, offset: 8, size: "4/8"}
      n_type_bits:
        source: include/mach-o/loader.h:285-295
        values:
          N_STAB: 0xe0
          N_PEXT: 0x10
          N_TYPE: 0x0e
          N_EXT: 0x01
      n_type_values:
        N_UNDF: 0x00
        N_ABS: 0x02
        N_INDR: 0x0a
        N_PBUD: 0x0c
        N_SECT: 0x0e
        NO_SECT: 0
      n_desc_bits:
        source: include/mach-o/loader.h:298-310
        values:
          REFERENCE_MASK: 0x0f
          REFERENCED_DYNAMICALLY: 0x10
          N_DESC_DISCARDED: 0x20
          N_NO_DEAD_STRIP: 0x20
          N_WEAK_REF: 0x40
          N_WEAK_DEF: 0x80
      interpretation:
        source: bfd/mach-o.c:1822-1912
        rules:
          - "Any N_STAB bit set -> BSF_DEBUGGING, and the symbol is treated as undefined."
          - "N_PEXT or N_EXT -> BSF_GLOBAL, otherwise BSF_LOCAL."
          - "N_UNDF with N_EXT and a nonzero value -> a COMMON symbol."
          - "N_INDR -> forced to undefined, with an error message."
          - "N_SECT with n_sect == 0 -> undefined, and explicitly NOT an error."
      dysymtab:
        size: 72
        source: include/mach-o/external.h:167-187
        fields:
          - {field: ilocalsym, offset: 0}
          - {field: nlocalsym, offset: 4}
          - {field: iextdefsym, offset: 8}
          - {field: nextdefsym, offset: 12}
          - {field: iundefsym, offset: 16}
          - {field: nundefsym, offset: 20}
          - {field: tocoff, offset: 24}
          - {field: ntoc, offset: 28}
          - {field: modtaboff, offset: 32}
          - {field: nmodtab, offset: 36}
          - {field: extrefsymoff, offset: 40}
          - {field: nextrefsyms, offset: 44}
          - {field: indirectsymoff, offset: 48}
          - {field: nindirectsyms, offset: 52}
          - {field: extreloff, offset: 56}
          - {field: nextrel, offset: 60}
          - {field: locreloff, offset: 64}
          - {field: nlocrel, offset: 68}

    relocations:
      record_size: 8
      note: "There is no 64-bit relocation_info; Mach-O uses the same 8-byte record in 64-bit files."
      source: include/mach-o/external.h:112-117
      non_scattered_bits:
        source: include/mach-o/reloc.h:26-43
        values:
          R_PCREL: 0x01000000
          R_EXTERN: 0x08000000
          r_length_bits: "25-26"
          r_type_bits: "28-31"
          r_symbolnum_mask: 0x00ffffff
        r_length_encoding: {0: 1, 1: 2, 2: 4, 3: 8, note: "bytes"}
      scattered_bits:
        values:
          SR_SCATTERED: 0x80000000
          SR_PCREL: 0x40000000
          r_length_bits: "28-29"
          r_type_bits: "24-27"
          address_mask: 0x00ffffff
      scattered_handling:
        source: bfd/mach-o.c:704-727
        rules:
          - "The scattered address is section-relative."
          - "BFD finds the containing section by searching the section table, and the addend becomes the intra-section offset."
          - "On write, the scattered fields go into r_address and the value into r_symbolnum: the field order is reversed (bfd/mach-o.c:924-936)."
      non_scattered_handling:
        source: bfd/mach-o.c:728-756
        rules:
          - "With R_EXTERN set, r_symbolnum & 0xffffff is a symbol table index."
          - "Otherwise it is a 1-based section index, and the addend is -section->addr."
      generic_types:
        source: include/mach-o/reloc.h:45-51
        values:
          GENERIC_RELOC_VANILLA: 0
          GENERIC_RELOC_PAIR: 1
          GENERIC_RELOC_SECTDIFF: 2
          GENERIC_RELOC_PB_LA_PTR: 3
          GENERIC_RELOC_LOCAL_SECTDIFF: 4
          GENERIC_RELOC_TLV: 5
      x86_64_types:
        source: include/mach-o/x86-64.h:26-35
        values:
          X86_64_RELOC_UNSIGNED: 0
          X86_64_RELOC_SIGNED: 1
          X86_64_RELOC_BRANCH: 2
          X86_64_RELOC_GOT_LOAD: 3
          X86_64_RELOC_GOT: 4
          X86_64_RELOC_SUBTRACTOR: 5
          X86_64_RELOC_SIGNED_1: 6
          X86_64_RELOC_SIGNED_2: 7
          X86_64_RELOC_SIGNED_4: 8
          X86_64_RELOC_TLV: 9
        scattered: "The x86-64 backend rejects scattered relocations outright (bfd/mach-o-x86-64.c:125-127)."
      arm64: "Absent from this tree entirely: no CPU_TYPE_ARM64, no arm64 relocation types."

    fat_files:
      entry_point: bfd_mach_o_archive_p
      source: bfd/mach-o.c:3109-3159
      header:
        size: 8
        source: include/mach-o/external.h:258-262
        fields:
          - {field: magic, offset: 0, size: 4, note: "always big-endian"}
          - {field: nfat_arch, offset: 4, size: 4}
      arch_entry:
        size: 20
        source: include/mach-o/external.h:263-271
        fields:
          - {field: cputype, offset: 0, size: 4}
          - {field: cpusubtype, offset: 4, size: 4}
          - {field: offset, offset: 8, size: 4}
          - {field: size, offset: 12, size: 4}
          - {field: align, offset: 16, size: 4, note: "documented as 'Power of 2'"}
      magics:
        accepted: {value: 0xcafebabe, note: "the only one BFD accepts, hard-coded at bfd/mach-o.c:3126"}
        absent: [FAT_CIGAM, FAT_MAGIC_64, FAT_CIGAM_64, fat_arch_64]
      nfat_arch_limit:
        value: 30
        source: bfd/mach-o.c:3128-3132
        reason: "Avoid matching Java bytecode files, which have the same magic; in the Java class format this field holds the JVM version, which starts at 43.0."
      presentation: >-
        A fat file is presented to BFD as an ARCHIVE: the fat target sets
        TARGET_ARCHIVE and fills the bfd_archive slot of bfd_check_format
        with bfd_mach_o_archive_p (bfd/mach-o.c:4240-4246).
      members:
        source: bfd/mach-o.c:3161-3229
        rules:
          - "Members are enumerated by walking the archentries table."
          - "Each member becomes a contained BFD whose origin is the entry's offset."
          - "The member filename is synthesised as <archive-path>:<arch-name>."
      align_field: "Read and stored, but never used. Member positions come solely from the explicit offset field."
      lesson: >-
        Slice enumeration and slice selection are separate operations.
        qBFD requires explicit selection with macho::openSlice
        (qMachO.hpp:156-160). Using explicit member offsets in BFD does not
        by itself imply that a universal file's layout is untrustworthy.

    export_trie_and_chained_fixups:
      status: "Not supported in this BFD vintage."
      detail: >-
        LC_DYLD_EXPORTS_TRIE and LC_DYLD_CHAINED_FIXUPS do not exist as
        constants in the tree, so such a file hits the default branch of
        bfd_mach_o_read_command: it prints "unable to read unknown load
        command" and the scan continues. Nothing is decoded.
      nearest_thing: >-
        LC_DYLD_INFO (0x22) is parsed and stores five (offset, size) pairs
        (rebase, bind, weak_bind, lazy_bind, export), but the export trie
        itself is never decoded (bfd/mach-o.c:2507-2528).

# ---------------------------------------------------------------------------
# 6. ar archives
# ---------------------------------------------------------------------------
  archive:
    files: ["bfd/archive.c", "bfd/archive64.c", "include/aout/ar.h"]
    note: "ar has no single standard; BFD implements three flavours plus two index layouts."

    magics:
      source: include/aout/ar.h:30-34
      values:
        ARMAG: {value: "!<arch>\\n", note: "SVR4/GNU and BSD"}
        ARMAGB: {value: "!<bout>\\n", note: "b.out archives, NOT thin"}
        ARMAGT: {value: "!<thin>\\n", note: "thin archives"}
      sarmag: 8
      arfmag: {value: "`\\n", size: 2}
    detection:
      source: bfd/archive.c:746-827
      steps:
        - "Read 8 bytes of magic; set the thin flag if it is ARMAGT."
        - "Accept ARMAG, ARMAGB or ARMAGT; otherwise the file is not an archive."
        - "Set first_file_filepos = SARMAG (8)."
        - "Slurp the armap and the extended name table."
        - "If the target was defaulted, open the first member and verify it is an object of the same target."

    member_header:
      size: 60
      source: include/aout/ar.h:44-53
      fields:
        - {field: "ar_name[16]", offset: 0, size: 16}
        - {field: "ar_date[12]", offset: 16, size: 12}
        - {field: "ar_uid[6]", offset: 28, size: 6}
        - {field: "ar_gid[6]", offset: 34, size: 6}
        - {field: "ar_mode[8]", offset: 40, size: 8}
        - {field: "ar_size[10]", offset: 48, size: 10}
        - {field: "ar_fmag[2]", offset: 58, size: 2, value: "`\\n"}
    name_forms:
      - {form: "short", rule: "The name is NUL-, '/'- or ' '-terminated within the 16-byte field; if none of those is present, the whole field is the name.", source: "bfd/archive.c:493-518"}
      - {form: "extended name table", rule: "The name field is '/<decimal offset>' into the // long-name table.", source: "bfd/archive.c:370-403"}
      - {form: "BSD-4.4 extended name", rule: "The name field is '#1/<len>'; the name follows the header and the payload size is reduced by len.", source: "bfd/archive.c:471-492"}
    padding:
      rule: "The next member header is rounded up to an even file offset; a BSD embedded name can make the object payload itself start at an odd offset."
      read: "filestart += filestart % 2  (bfd/archive.c:740)"
      write: "A single '\\n' pad byte is written after an odd-sized member (bfd/archive.c:2182-2186)."
      note: "A member can have an odd size and an odd origin; the comment at bfd/archive.c:737-739 calls this out."

    index_formats:
      dispatcher: bfd_slurp_armap
      source: bfd/archive.c:1049-1101
      dispatch_table:
        - {name_field: "'__.SYMDEF       ' or '__.SYMDEF/      '", handler: do_slurp_bsd_armap, source: "bfd/archive.c:1063-1065"}
        - {name_field: "'/               '", handler: do_slurp_coff_armap, source: "bfd/archive.c:1066-1067"}
        - {name_field: "'/SYM64/         '", handler: bfd_elf64_archive_slurp_armap, source: "bfd/archive.c:1068-1078"}
        - {name_field: "'#1/20           ' with an extended name of __.SYMDEF SORTED or __.SYMDEF", handler: do_slurp_bsd_armap, source: "bfd/archive.c:1079-1097"}
        - {name_field: anything else, handler: "no index: bfd_has_map = FALSE", source: "bfd/archive.c:1099-1100"}
      bsd_symdef:
        source: bfd/archive.c:849-915
        byte_order: "Target byte order via H_GET_32 / H_PUT_32, NOT fixed big-endian."
        layout:
          - "A 32-bit count of the INDEX TABLE SIZE in bytes, not a symbol count."
          - "symdef_count = that value / 8  (BSD_SYMDEF_SIZE, bfd/archive.c:835)."
          - "symdef_count entries of 8 bytes: a 4-byte string-table offset and a 4-byte file offset."
          - "A 4-byte string-table size."
          - "The NUL-separated string table."
        sanity_check: "If symdef_count * 8 > parsed_size - 4 the archive is rejected with 'Probably we're using the wrong byte ordering.' (bfd/archive.c:881-887)."
      coff_armap:
        source: bfd/archive.c:920-1044
        byte_order: "Always big-endian: 'It seems that all numeric information in a coff archive is always in big endian format, nomatter the host or target.' (bfd/archive.c:948-951)"
        layout:
          - "A big-endian 32-bit symbol count."
          - "nsymz big-endian 32-bit file offsets."
          - "The NUL-separated string table."
        extras: "Detects the PE 'second archive header' (bfd/archive.c:1019-1035)."
      sym64:
        source: bfd/archive64.c:41-138
        byte_order: "Big-endian."
        layout:
          - "An 8-byte big-endian symbol count."
          - "nsymz 8-byte big-endian file offsets."
          - "The NUL-separated string table; stringsize = parsed_size - 8*nsymz - 8."
        padding: "Padded to an 8-byte boundary (bfd/archive64.c:161, 229-236)."
    extended_name_table:
      source: bfd/archive.c:1222-1301
      recognition: "The first member's name field is 'ARFILENAMES/    ' or '//              '."
      rules:
        - "Names are newline-terminated; a backslash is converted to a slash."
        - "first_file_filepos is advanced past the table and padded to even."
    thin_archives:
      rule: "Ordinary thin members record an external payload size without embedding those bytes. Special members such as indices and the long-name table remain embedded."
      consequence: >-
        The member payload lives in a separate file. A reader can enumerate
        the members but cannot materialise their contents from the archive
        alone.
      qbfd_equivalent: "qArchive's readMember materialises thin members; memberData cannot (see qbfd/README.md:60)."
    bsd_symdef_recognised: >-
      BFD recognises and decodes __.SYMDEF, including the extended-name
      __.SYMDEF SORTED form handled by bfd_slurp_armap. qBFD recognises BSD
      index members but leaves symbolIndex() empty (qArchive.hpp:385-399).
      The target-endian layout is described above; it is not undecodable.

    target_hooks:
      slots: "The 11 BFD_JUMP_TABLE_ARCHIVE slots (bfd/bfd-in2.h:5932-5943)."
      predefined_sets:
        source: bfd/libbfd-in.h:273-355
        sets:
          - {name: _bfd_noarchive, note: "all stubs; used by the Mach-O object targets"}
          - {name: _bfd_archive_bsd, note: "BSD armap and name truncation"}
          - {name: _bfd_archive_coff, note: "COFF armap"}
          - {name: _bfd_archive_bsd44, note: "BSD-4.4 long names"}
      note: >-
        libbfd-in.h defines bfd_slurp_bsd_armap and bfd_slurp_coff_armap as
        aliases of the single bfd_slurp_armap dispatcher, which then chooses
        the flavour from the member's name field (bfd/libbfd-in.h:144-145).

# ---------------------------------------------------------------------------
# 7. The canonical model qBFD exposes
# ---------------------------------------------------------------------------
canonical_model:
  note: >-
    qBFD does not expose BFD's structures. It defines a small format-neutral
    vocabulary and maps every backend onto it. This section records how the
    BFD concepts correspond to that vocabulary, and where the mapping is lossy.

  section_flags:
    qbfd_definition: "qBFDCore.hpp:105-121"
    bfd_definition: "bfd/bfd-in2.h:1178-1357"
    bfd_values:
      SEC_NO_FLAGS: 0x000
      SEC_ALLOC: 0x001
      SEC_LOAD: 0x002
      SEC_RELOC: 0x004
      SEC_READONLY: 0x008
      SEC_CODE: 0x010
      SEC_DATA: 0x020
      SEC_ROM: 0x040
      SEC_CONSTRUCTOR: 0x080
      SEC_HAS_CONTENTS: 0x100
      SEC_NEVER_LOAD: 0x200
      SEC_THREAD_LOCAL: 0x400
      SEC_HAS_GOT_REF: 0x800
      SEC_IS_COMMON: 0x1000
      SEC_DEBUGGING: 0x2000
      SEC_IN_MEMORY: 0x4000
      SEC_EXCLUDE: 0x8000
      SEC_SORT_ENTRIES: 0x10000
      SEC_LINK_ONCE: 0x20000
      SEC_LINK_DUPLICATES_DISCARD: 0x0
      SEC_LINK_DUPLICATES_ONE_ONLY: 0x40000
      SEC_LINK_DUPLICATES_SAME_SIZE: 0x80000
      SEC_LINK_DUPLICATES_SAME_CONTENTS: 0xc0000
      SEC_LINKER_CREATED: 0x100000
      SEC_KEEP: 0x200000
      SEC_SMALL_DATA: 0x400000
      SEC_MERGE: 0x800000
      SEC_STRINGS: 0x1000000
      SEC_GROUP: 0x2000000
      SEC_COFF_SHARED_LIBRARY: 0x4000000
      SEC_COFF_SHARED: 0x8000000
      SEC_COFF_NOREAD: 0x40000000
    qbfd_values:
      None: 0
      Alloc: "1 << 0"
      Load: "1 << 1"
      Code: "1 << 2"
      Data: "1 << 3"
      ReadOnly: "1 << 4"
      Writable: "1 << 5"
      Exec: "1 << 6"
      Bss: "1 << 7"
      Debug: "1 << 8"
      Reloc: "1 << 9"
      Strings: "1 << 10"
      Note: "1 << 11"
      Tls: "1 << 12"
      Discard: "1 << 13"
    mapping_scope: "Conceptual correspondences, not numeric conversions or identical classification rules. The qBFD backends map native flags directly."
    mapping:
      Alloc: SEC_ALLOC
      Load: "Roughly SEC_LOAD; qBFD commonly uses this for file-backed bytes, whereas BFD distinguishes SEC_LOAD from SEC_HAS_CONTENTS."
      Code: SEC_CODE
      Data: SEC_DATA
      ReadOnly: SEC_READONLY
      Writable: "Native write permission, such as SHF_WRITE or IMAGE_SCN_MEM_WRITE; absence of SEC_READONLY is not a universal permission test."
      Exec: "Native instruction/execution classification; qBFD distinguishes this bit from Code."
      Bss: "Native zero-fill classification, such as SHT_NOBITS; fileSize == 0 alone also describes empty non-BSS sections."
      Debug: SEC_DEBUGGING
      Reloc: SEC_RELOC
      Strings: SEC_STRINGS
      Tls: SEC_THREAD_LOCAL
      Discard: "COFF/PE mapping includes IMAGE_SCN_LNK_REMOVE, IMAGE_SCN_MEM_DISCARDABLE and COMDAT; this does not mean every such section is unconditionally discarded."
      Note: "No direct SEC_NOTE bit; qBFD sets Note for ELF SHT_NOTE and COFF IMAGE_SCN_LNK_INFO."
    lossy:
      - "SEC_HAS_CONTENTS has no separate qBFD bit; fileOffset/fileSize describe the file-backed range, including zero-length ranges."
      - "SEC_MERGE, SEC_GROUP, SEC_LINK_ONCE and SEC_LINK_DUPLICATES_* have no one-to-one common flags. Native metadata and format-specific accessors preserve some of that information; COFFFile::comdat exposes COMDAT selection."

  symbol_flags:
    bfd_definition: "bfd/bfd-in2.h:5061-5161"
    notable:
      BSF_NO_FLAGS: 0x00
      BSF_LOCAL: 0x01
      BSF_GLOBAL: 0x02
      BSF_EXPORT: 0x02
      BSF_DEBUGGING: 0x04
      BSF_FUNCTION: 0x08
      BSF_KEEP: 0x20
      BSF_KEEP_G: 0x40
      BSF_WEAK: 0x80
      BSF_SECTION_SYM: 0x100
      BSF_OLD_COMMON: 0x200
      BSF_NOT_AT_END: 0x400
      BSF_CONSTRUCTOR: 0x800
      BSF_WARNING: 0x1000
      BSF_INDIRECT: 0x2000
      BSF_FILE: 0x4000
      BSF_DYNAMIC: 0x8000
      BSF_OBJECT: 0x10000
      BSF_DEBUGGING_RELOC: 0x20000
      BSF_THREAD_LOCAL: 0x40000
      BSF_RELC: 0x80000
      BSF_SRELC: 0x100000
      BSF_SYNTHETIC: 0x200000
      BSF_GNU_INDIRECT_FUNCTION: 0x400000
      BSF_GNU_UNIQUE: 0x800000
    notes:
      - "BSF_EXPORT is an alias of BSF_GLOBAL; the source comment says 'No real difference.'"
      - "BSF_KEEP (1 << 5) and BSF_KEEP_G (1 << 6) are in the source but rarely used."
    qbfd_equivalent:
      binding: "SymbolBinding {Local, Global, Weak, Unique}  (qBFDCore.hpp:141)"
      kind: "SymbolKind {None, Object, Function, Section, File, Common, Tls, Indirect}  (qBFDCore.hpp:142-151)"
      flags: "sym::Flags {Undefined, Absolute, Hidden, Exported, Imported, Synthetic, Debug}  (qBFDCore.hpp:154-163)"
    mapping:
      BSF_LOCAL: SymbolBinding::Local
      BSF_GLOBAL: SymbolBinding::Global
      BSF_WEAK: SymbolBinding::Weak
      BSF_FUNCTION: SymbolKind::Function
      BSF_SECTION_SYM: SymbolKind::Section
      BSF_FILE: SymbolKind::File
      BSF_INDIRECT: "Alias/indirect-symbol concept; distinct from GNU IFUNC."
      BSF_GNU_INDIRECT_FUNCTION: "SymbolKind::Indirect for ELF STT_GNU_IFUNC (qELF.hpp:345-347)."
      BSF_GNU_UNIQUE: SymbolBinding::Unique
      BSF_SYNTHETIC: "Related to sym::Synthetic; producer-specific meaning must still be checked."
      BSF_THREAD_LOCAL: SymbolKind::Tls
      STB_GNU_UNIQUE: SymbolBinding::Unique
      STV_HIDDEN: sym::Hidden
      undefined: "an empty Symbol::section plus sym::Undefined"
    semantic_caveats: >-
      BFD has GNU_UNIQUE and SYNTHETIC flags in this snapshot. BSF_EXPORT is
      only an alias of BSF_GLOBAL, not a separate loader-export marker.
      qBFD's Imported/Exported flags are populated by format-specific paths,
      such as PE import/export directories, and are not a mechanical
      translation of BSF_EXPORT or of an undefined symbol.

  relocation_model:
    qbfd_definition: "qBFDCore.hpp:181-194"
    bfd_equivalent: "arelent (bfd/bfd-in2.h:2247-2262) plus reloc_howto_type (bfd/bfd-in2.h:2283-2366)"
    mapping:
      offset: arelent.address
      symbol: "arelent.sym_ptr_ptr (asymbol **), resolved to an index"
      addend: arelent.addend
      nativeType: howto.type
      typeName: howto.name
      bitSize: "Comparable to howto.bitsize, but qBFD tables can describe storage width; it cannot be derived universally from howto.size."
      pcRelative: howto.pc_relative
    differences:
      - "BFD's howto carries rightshift, bitpos, src_mask, dst_mask and pcrel_offset. These also matter when decoding an implicit addend. qBFD's common Relocation record omits them and relies on format/architecture-specific logic."
      - "qBFD adds hasAddend, because a reader can meet a REL relocation whose implicit addend it does not decode."
      - "qBFD adds dynamicSymbol, because an ELF relocation's symbol index may refer to the dynamic symbol table."
      - "qBFD explicitly records targetSection and scattered. BFD can express a section target through a section symbol; its Mach-O canonicalizer resolves scattered r_value into a section symbol plus addend (bfd/mach-o.c:690-730)."

  file_types:
    mapping:
      ET_REL: FileType::Relocatable
      ET_EXEC: FileType::Executable
      ET_DYN: FileType::SharedObject
      ET_CORE: FileType::Core
      MH_OBJECT: FileType::Relocatable
      MH_EXECUTE: FileType::Executable
      MH_DYLIB: FileType::SharedObject
      PE image: "FileType::Executable, or SharedObject for a DLL"

# ---------------------------------------------------------------------------
# 8. Where qBFD goes beyond, or differs from, BFD
# ---------------------------------------------------------------------------
divergences:
  bfd_2_22_absences:
    note: >-
      These features were not found in the relevant local headers/backends.
      qBFD support is described from its own source, independently of this
      older snapshot. Architecture recognition and relocation naming do not
      imply support for applying every relocation.
    items:
      - {thing: "AArch64 ELF support", bfd: "no include/elf/aarch64.h, no bfd/elfxx-aarch64.c, no EM_AARCH64", qbfd: "handles R_AARCH64_* and EM_AARCH64"}
      - {thing: "RISC-V ELF support", bfd: "no include/elf/riscv.h, no bfd/elfxx-riscv.c, no EM_RISCV", qbfd: "handles R_RISCV_* and EM_RISCV"}
      - {thing: "SHF_COMPRESSED", bfd: "absent; BFD 2.22 uses the .zdebug naming convention", qbfd: "returns compressed section bytes as stored, and does not decompress"}
      - {thing: "COFF bigobj", bfd: "no ANON_OBJECT_HEADER_BIGOBJ and no 56-byte bigobj header found", qbfd: "decodes the 56-byte bigobj header, 20-byte symbol records and 32-bit section numbers", source: "qCOFF.hpp:429-478,595-596,631-635"}
      - {thing: "IMAGE_FILE_MACHINE_ARM64", bfd: "absent", qbfd: "maps 0xAA64 to AArch64 and registers a PE ARM64 target", source: "qPE.hpp:25,77-110,838-847"}
      - {thing: "LC_MAIN", bfd: "absent", qbfd: "decodes LC_MAIN entry points"}
      - {thing: "LC_DYLD_EXPORTS_TRIE and LC_DYLD_CHAINED_FIXUPS", bfd: "absent; unknown commands produce a diagnostic and are skipped", qbfd: "no dedicated decoding branch; passes over unhandled command payloads after generic size checks", source: "qMachO.hpp:182-228"}
      - {thing: "FAT_MAGIC_64 / FAT_CIGAM / fat_arch_64", bfd: "absent; only 0xcafebabe with 20-byte fat_arch", qbfd: "handles 32- and 64-bit universal slice tables"}
      - {thing: "S_THREAD_LOCAL_* section types", bfd: "absent from the local Mach-O section-type enum", qbfd: "types 0x11-0x15 set Tls; type 0x12 also has zero-fill semantics", source: "qMachO.hpp:286-307"}
      - {thing: "ELF SHT_RELR", bfd: "absent", qbfd: "parseRelocations is called only for REL and RELA sections; no RELR expansion", source: "qELF.hpp:260-262"}

  observed_api_differences:
    - {item: "One object-level Endian value", observation: "BFD has separate header/data byte-order vectors. Nested archive structures still need their own ordering rules.", source: "qBFDCore.hpp:236; qArchive.hpp:404-405"}
    - {item: "Smaller error taxonomy", observation: "qBFD returns Expected<T>; BFD uses a global error code. This alone makes no thread-safety guarantee.", source: "qBFDCore.hpp:27-67; bfd/bfd.c:392-394"}
    - {item: "Canonical vectors", observation: "qBFD exposes vectors of symbols and relocation values. BFD canonicalization exposes pointer arrays; name hashes are separate structures.", source: "qBFDCore.hpp:244-252; bfd/syms.c:346-355"}
    - {item: "Reader interface plus separate rewriting paths", observation: "ObjectFile is an inspection interface; qStrip rewrites object tables and qArchive also implements archive writing."}
    - {item: "Narrower format set", observation: "qBFD covers ELF, PE, COFF, Mach-O and ar; the BFD snapshot contains additional format families."}

  additional_metadata_and_limits:
    - {item: "Explicit universal-slice selection", observation: "macho::openSlice selects one object; the ordinary Mach-O open path rejects a fat container.", source: "qMachO.hpp:156-160"}
    - {item: "BSD index decoding omitted", observation: "Members remain accessible but parseIndex returns without decoding a BSD symbol index.", source: "qArchive.hpp:385-399"}
    - {item: "Windows archive index decoding omitted", observation: "Two leading '/' members select Windows flavor and parseIndex returns without an index. BFD decodes the first '/' as a big-endian armap and skips the second; the first is not an unrelated import lookup table.", source: "qArchive.hpp:308-316,392-399; bfd/archive.c:948-1035"}
    - {item: "hasAddend and dynamicSymbol", observation: "These distinguish available addends and static/dynamic symbol-index domains.", source: "qBFDCore.hpp:181-194"}
    - {item: "Format-specific layout accessors", observation: "All four object backends expose Layout. ELF and PE expose rawSections(); COFF exposes section/relocation field offsets. These are not identical APIs.", source: "qELF.hpp:98-116; qPE.hpp:235-260; qCOFF.hpp:283-315; qMachO.hpp:107-116"}

  resolved_questions:
    coff_relocation_count_overflow:
      bfd_source: bfd/coffcode.h:1887-1909
      qbfd_source: qCOFF.hpp:368-419
      answer: >-
        COFFFile::relocations handles IMAGE_SCN_LNK_NRELOC_OVFL when the
        header count is 0xffff. It reads the first record's VirtualAddress,
        rejects a zero count, subtracts the placeholder, advances by ten
        bytes and bounds-checks the remaining records.
      rewriting_limit: >-
        qStrip.hpp:723-735 reads that placeholder but rejects a real count
        above 0xffff. Reader support therefore does not imply unrestricted
        strip/renumber support.
      source_review_followup: >-
        The overflow write at qStrip.hpp:753-754 uses placeholder + 4,
        whereas both readers use placeholder + 0 for the count. This is
        an observed source discrepancy; the source-note checks do not
        exercise this overflow-rewriting path at runtime.
    short_import_library_member:
      bfd_source: bfd/peicode.h:1070-1242
      qbfd_sources: ["qCOFF.hpp:429-445", "qPE.hpp:377-411", "qArchive.hpp:308-316,392-399"]
      answer: >-
        No short-import-object decoder was found in these qBFD paths. COFF
        recognizes the 0000/ffff prefix only with a valid bigobj header,
        version and class ID; otherwise it expects a known machine at
        offset zero. PE expects MZ and PE signatures. Recognizing a Windows
        archive container or decoding a PE image's imports does not decode
        an ILF member's symbol/DLL strings.
    pe_line_number_overflow:
      bfd_source: bfd/peicode.h:211-221
      qbfd_sources: ["qPE.hpp:187-195", "qPE.hpp:328-345", "qPE.hpp:470-497"]
      answer: >-
        BFD's COFF_IMAGE_WITH_PE path combines the line-number count with
        s_nreloc << 16 and clears the relocation count. qBFD does not expose
        those line-number fields: it reads offset 32 as a relocation count
        and uses it for relocation bounds and iteration. The same legacy
        line-number-overflow interpretation is not implemented there.

# ---------------------------------------------------------------------------
# 9. Where this lands in qBFD
# ---------------------------------------------------------------------------
qbfd_mapping:
  qBFDCore.hpp:
    - "Format, Arch, Endian, FileType enums (lines 70-99): the canonical identity vocabulary."
    - "sec::Flags (105-121): the canonical section flags."
    - "Section (124-136): the canonical section, including nativeFlags and nativeType."
    - "SymbolBinding, SymbolKind, sym::Flags (141-164): the canonical symbol model."
    - "Symbol (166-176): the canonical symbol."
    - "Relocation (181-194): the canonical relocation, with hasAddend and dynamicSymbol."
    - "seg::Flags and Segment (199-219): the canonical segment, used for ELF program headers and Mach-O LC_SEGMENT."
    - "ObjectFile (226+): the format-independent interface."
    - "ArchiveFlavor, Archive, ArchiveOptions (396+): the ar model."
    - "Target and Registry (467+): the backend registry, the analogue of BFD's bfd_target vector."
    - "Error::Code (29-38): the error taxonomy, the analogue of bfd_error_type."
  qELF.hpp:
    - "The ELF reader. Relocation naming for x86-64, i386, AArch64, RISC-V, ARM and PowerPC."
  qCOFF.hpp:
    - "The COFF reader, including bigobj and relocation-count overflow decoding."
  qPE.hpp:
    - "The PE reader, including the DOS stub, optional header and data directories."
  qMachO.hpp:
    - "The Mach-O reader, including the universal slice table."
  qArchive.hpp:
    - "The ar reader and writer, covering the SVR4/GNU, BSD and thin flavours."
  qStrip.hpp:
    - "The rewriter. Uses the Layout and rawSections() accessors that BFD's private section data would have provided."
  qBFD.hpp:
    - "The umbrella header: open, openAs, detectFormat and the open pipelines."

# ---------------------------------------------------------------------------
# 10. ArchBFD application layer
# ---------------------------------------------------------------------------
application_layer:
  name: ArchBFD
  guide: ArchBFD.md
  implementation: "Independent application API over the local qBFD readers; no GNU BFD headers or libbfd linkage."
  files:
    BFDBinABI.h: "Versioned C ABI with opaque object/archive handles, fixed numeric constants, metadata records and caller-owned errors."
    BFDBinABI.c: "C11 endian integer reads/writes with checked bounds and no mutation on a rejected write."
    BFDBinBridge.cpp: "Reader integration, owned input buffers, cached relocation/dependency views and exception translation."
    BFDBinAPI.hpp: "C++20 move-only RAII handles and metadata collection helpers."
    ArchBFD.h: "C application umbrella."
    ArchBFD.hpp: "C++ application umbrella."
    ArchBFDApp.hpp: "Archive-aware synchronous visitor for inspection applications."
  source_lessons_applied:
    - "Opaque handles separate parsed-object lifetime from caller-owned input bytes; memory opens copy their input."
    - "Canonical metadata uses explicit missing-index sentinels, relocation symbol-table domains and owning-section indices."
    - "Input bounds use subtraction checks instead of overflow-prone offset-plus-length comparisons."
    - "Native application ABI records are not cast onto packed on-disk headers."
    - "Per-call errors and stable borrowed views make ownership explicit; they are not a blanket concurrency guarantee."
    - "The application interface preserves reader capabilities and limitations rather than claiming BFD-compatible behavior."
  validation_scope: "Cross-language ABI tests cover ownership, invalid arguments, output-on-error behavior, bounds, archive lifetime, byte order and explicit universal slices."

# ---------------------------------------------------------------------------
# 11. Method
# ---------------------------------------------------------------------------
method:
  how_this_was_produced:
    - "Inventoried the top-level bfd C sources and headers, then read selected functions and definitions. The inventory counts are not a claim of complete reading."
    - "Traced generic lifecycle, I/O, section, symbol, hash, target-selection and relocation behavior through the functions cited under architecture."
    - "Read selected ELF, COFF/PE, Mach-O and archive paths; consulted external-layout and constant definitions under include/ and bfd/."
    - "Compared selected claims with the current qBFD headers. Observed implementation behavior is separate from inferred design guidance and does not establish historical intent."
  coverage:
    reviewed_paths: "See source.primary_files and the function-level citations. Coverage is selective, including within each listed file."
    not_exhaustively_reviewed:
      - "All 335 C translation units or every function in the core files."
      - "Every CPU relocation backend and ABI-specific encoding."
      - "Full linker, DWARF/debug, core-file, plugin and less-common object-format implementations."
      - "Exhaustive runtime behavior of qBFD readers or writers. ArchBFD boundary tests are separate from this selective source review."
    absence_claims: "Scoped to the local snapshot and relevant searches, not to all GNU BFD versions. Not reviewed is not the same as absent."
  confidence:
    direct_evidence: "Definitions, field layouts and local branches identified by citations; validation covers selected tables, not every statement."
    interpretation: "Lessons and conceptual API correspondences are analysis of those paths, not additional guarantees made by BFD."
    modern_features: "qBFD observations about features absent from the snapshot are grounded in qBFD code; this document is not a complete modern ABI specification."
  validation:
    - "Repeatable source checks are in tests/validate_bfd_notes.py (requires PyYAML and the local binutils snapshot)."
    - "Parsed the complete YAML with duplicate-key rejection."
    - "Compared all 14 documented ELF32/ELF64 external record sizes and their field offsets with include/elf/external.h: 104 assertions."
    - "Compared all nine target jump-table groups with the BFD_JUMP_TABLE_* macros and the relocation-width map with bfd_get_reloc_size."
    - "Checked the documented SEC_* and BSF_* numeric values against bfd-in2.h definitions."
    - "Checked cited BFD paths and initial line ranges; generated-file and explicitly absent-file references are exceptions. These checks establish location validity, not every behavioral claim."
  caveats:
    - "Line numbers refer to the imported tree and will drift if binutils/ is updated."
    - "This is a 2011-era snapshot. Consult newer sources independently for later architectures, APIs and format extensions."
    - "Backend callbacks can override generic behavior. A generic helper's behavior must not be assumed for every target."
