# Cephyr configuration. Unknown keys and wrong TOML types are errors.
#
# Relative paths are resolved from this file's directory. Built-in resource,
# Archon, and XDG/HOME cache defaults are used when their entries are omitted.

target = "x86_64-linux-gnu" # Or "auto" to require a supported native host/ABI.
representation = "gated"
assembler_style = "driver"  # Explicit replacement: "driver" (e.g. GCC) or "as" (raw).
stdlib = "cephyr"            # "cephyr", "system", or "none"
# Packaged native stages do not need a cache. Legacy cache settings are accepted.
cache_enabled = true
static_link = true

# Uncomment to override paths. An empty cache_path disables cache storage
# when XDG_CACHE_HOME and HOME are intentionally not used by the embedding app.
#
# [paths]
# triple_dir = "triples"
# triple_script = "triples/x86_64-linux-gnu.lua" # explicit script bypasses host detection
# archon_root = "../Archon"
# stdlib_root = "stdlib"
# cache_path = ".cephyr-cache"
# sysroot = "/opt/target/sysroot"

[tools]
# A string is one executable with no fixed arguments. An array is an argv
# vector; it is passed directly and is never interpreted by a shell.
# Executable paths containing "/" are relative to this file unless absolute;
# bare executable names are looked up on PATH.

# Target tools and their required flags normally come from triples/<target>.lua.
# An explicit tool replaces that bank command, so include all required fixed
# target arguments in the argv array:
# assembler = ["x86_64-linux-gnu-gcc"]
# linker = "ld"
#
# Linking with stdlib = "system" requires an explicit compiler-driver linker,
# such as "x86_64-linux-gnu-gcc", rather than raw ld.
# The bundled assembler and linker are SandAS and qobjld. Backend modules,
# CRT and libc archives are generated once at Cephyr package build time.

[flags]
assemble = []
link = []

[preprocess]
include_dirs = []
system_include_dirs = []
forced_includes = []
defines = []
undefines = []
trigraphs = true
keep_comments = false
line_markers = true
hosted = true

# Extensions load in array order; paths are relative to this configuration.
# Lua is sandboxed and sees only the string values in lua_env. Native code
# runs in the compiler process and requires explicit --allow-native-plugins.
# See extension/CONFIGURATION.md for precedence, limits and the plugin ABI.
# [extensions]
# lua = ["extensions/build.lua"]
# lua_env = { BUILD_MODE = "checked" }
# native = ["plugins/libproject.so"]

# SandSLAB shortens native AMD64 constants after lowering (default: off).
# [sandslab]
# enabled = true

# Blackstone optimizes MIR by default. Uncomment to disable it.
# [blackstone]
# enabled = false

# FactIR runs before the native backend or MIR emission. Override with --no-factir.
# [factir]
# enabled = false

# Optional QML optimization profile; select with --profile NAME or uncomment [qml].
# [qml]
# profile = "optimizing"
#
# [profiles.optimizing]
# passes = ["canonicalize", "strength_reduce"]
# files = [] # Relative to this file; add trusted QML rule fragments here.
# fuel = 4096
# parameters = { canonicalize = { fuel = 2048 } }
